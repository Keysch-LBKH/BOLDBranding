  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

otate(360deg);}}\n    @keyframes narrowDemoSwing{0%,100%{transform:translateX(0) rotate(0deg);}25%{transform:translateX(22px) rotate(7deg);}50%{transform:translateX(0) rotate(0deg);}75%{transform:translateX(-22px) rotate(-7deg);}}\n    .narrow-demo-card{animation:narrowDemoSwing 3s ease-in-out infinite;}\n  <\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh;background:var(--color-neutral-200);display:flex;justify-content:center;padding:24px 12px;box-sizing:border-box;\">\n<div style=\"width:100%;max-width:430px;background:var(--color-bg);min-height:844px;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);\">\n\n  <div style=\"padding:20px 20px 0;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n      <div style=\"display:flex;align-items:center;gap:8px;\">\n        <img src=\"48a5b393-61b7-4216-9d2b-1ea813e6935f\" alt=\"LBKH Solutions\" style=\"width:22px;height:22px;object-fit:contain;\">\n        <div style=\"font:700 13px/1 var(--font-heading);letter-spacing:0.02em;text-transform:uppercase;color:var(--color-text);\">LBKH Solutions<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:14px;\">\n        <button sc-camel-on-click=\"{{ onToggleTheme }}\" style=\"border:2px solid var(--color-text);background:none;font:600 10px var(--font-body);text-transform:uppercase;letter-spacing:0.04em;color:var(--color-text);cursor:pointer;padding:4px 8px;\">{{ themeLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetAll }}\" style=\"border:none;background:none;font:600 11px var(--font-body);color:var(--color-neutral-700);cursor:pointer;padding:4px 0;\">Start Over<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:14px;font:600 10px/1 var(--font-body);letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);\">{{ stepLabel }}<\u002Fdiv>\n    <div style=\"margin-top:8px;height:2px;background:var(--color-neutral-300);width:100%;\">\n      <div style=\"height:2px;background:var(--color-accent);width:{{ progressPct }}%;\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"guide-scroll\" style=\"flex:1;overflow-y:auto;padding:20px;box-sizing:border-box;\">\n\n    <sc-if value=\"{{ showAiWarning }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:2px solid var(--color-accent);background:var(--color-accent-100);padding:12px 14px;margin-bottom:16px;\">\n        <div style=\"font:700 11px var(--font-body);text-transform:uppercase;letter-spacing:0.04em;color:var(--color-accent-700);margin-bottom:4px;\">Setup needed<\u002Fdiv>\n        <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-accent-900);\">The AI-generated steps (values statement, brand voice, visual identity, guide) need an AI endpoint configured for this site. Everything else works normally.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showIntro }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:20px;padding-top:24px;\">\n        <div style=\"height:2px;background:var(--color-accent);width:56px;\"><\u002Fdiv>\n        <div style=\"font:700 28px/1.1 var(--font-heading);color:var(--color-text);\">Let's get your details.<\u002Fdiv>\n        <div style=\"font:400 14px/1.5 var(--font-body);color:var(--color-neutral-700);\">We'll use this to personalize your Brand Guide and, if you choose, send it to you when it's done.<\u002Fdiv>\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:18px;display:flex;flex-direction:column;gap:14px;\">\n          <div class=\"field\">\n            <label>Your name<\u002Flabel>\n            <input class=\"input\" type=\"text\" placeholder=\"Jane Smith\" value=\"{{ contact.yourName }}\" sc-camel-on-change=\"{{ onContactYourNameChange }}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Phone number<\u002Flabel>\n            <input class=\"input\" type=\"tel\" placeholder=\"(555) 123-4567\" value=\"{{ contact.phone }}\" sc-camel-on-change=\"{{ onContactPhoneChange }}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Email<\u002Flabel>\n            <input class=\"input\" type=\"email\" placeholder=\"jane@business.com\" value=\"{{ contact.email }}\" sc-camel-on-change=\"{{ onContactEmailChange }}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Business name<\u002Flabel>\n            <input class=\"input\" type=\"text\" placeholder=\"Smith &amp; Co.\" value=\"{{ contact.businessName }}\" sc-camel-on-change=\"{{ onContactBusinessNameChange }}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Website<\u002Flabel>\n            <input class=\"input\" type=\"text\" placeholder=\"www.smithandco.com\" value=\"{{ contact.website }}\" sc-camel-on-change=\"{{ onContactWebsiteChange }}\">\n          <\u002Fdiv>\n          <div class=\"field\">\n            <label>Main social (we'll follow)<\u002Flabel>\n            <input class=\"input\" type=\"text\" placeholder=\"@smithandco\" value=\"{{ contact.social }}\" sc-camel-on-change=\"{{ onContactSocialChange }}\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onIntroNext }}\" class=\"btn btn-primary btn-block\" disabled=\"{{ !introComplete }}\" style=\"margin-top:8px;\">Continue<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showWelcome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:24px;padding-top:24px;\">\n        <div style=\"height:2px;background:var(--color-accent);width:56px;\"><\u002Fdiv>\n        <div style=\"font:700 34px/1.05 var(--font-heading);color:var(--color-text);\">Define your business values.<\u002Fdiv>\n        <div style=\"font:400 15px/1.6 var(--font-body);color:var(--color-neutral-700);\">A guided workbook for reviewing your business's experience, brainstorming what matters, narrowing to what's essential, and leaving with a clear Values Statement you can share with your team.<\u002Fdiv>\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:20px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">01<\u002Fdiv><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Life Experience Review<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">02<\u002Fdiv><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Brainstorm<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">03<\u002Fdiv><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Narrow<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">04<\u002Fdiv><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Rank<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">05<\u002Fdiv><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Reflect<\u002Fdiv><\u002Fdiv>\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">06<\u002Fdiv><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Values Statement<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onNext }}\" class=\"btn btn-primary btn-block\" style=\"margin-top:8px;\">Get Started<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showLifeReview }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <sc-if value=\"{{ isLifeArea }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">{{ currentAreaLabel }}<\u002Fdiv>\n          <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">List a few things you Love, Like, Tolerate or Dislike about this part of the business. Don't overthink it — go with feeling.<\u002Fdiv>\n          <sc-for list=\"{{ lifeColumns }}\" as=\"col\" hint-placeholder-count=\"4\">\n            <div style=\"border-top:2px solid var(--color-neutral-300);padding:14px 0;\">\n              <div style=\"font:700 11px var(--font-heading);letter-spacing:0.06em;text-transform:uppercase;color:{{ col.color }};margin-bottom:8px;\">{{ col.title }}<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;\">\n                <sc-for list=\"{{ col.items }}\" as=\"chip\" hint-placeholder-count=\"2\">\n                  <span sc-camel-on-click=\"{{ chip.onRemove }}\" class=\"tag tag-neutral\" style=\"cursor:pointer;\">{{ chip.text }} ×<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n              <div style=\"display:flex;gap:8px;\">\n                <input class=\"input\" type=\"text\" placeholder=\"Add one...\" value=\"{{ col.draft }}\" sc-camel-on-change=\"{{ col.onChange }}\" sc-camel-on-key-down=\"{{ col.onKeyDown }}\" style=\"flex:1;\">\n                <button sc-camel-on-click=\"{{ col.onAdd }}\" class=\"btn btn-secondary\">Add<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ isLifeSynthesis }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Notice the themes<\u002Fdiv>\n          <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Look back over everything you just listed.<\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n            <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">What values and common themes do you notice?<\u002Fdiv>\n            <textarea class=\"input\" rows=\"3\" value=\"{{ themesNote }}\" sc-camel-on-change=\"{{ onThemesChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n            <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Where you tolerate or dislike something, what value might not be getting met?<\u002Fdiv>\n            <textarea class=\"input\" rows=\"3\" value=\"{{ dislikeNote }}\" sc-camel-on-change=\"{{ onDislikeChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"text-align:right;font:500 11px var(--font-body);color:var(--color-neutral-500);\">Area {{ lifeAreaDisplayNum }} of 6<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showBrainstorm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">What matters most?<\u002Fdiv>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Here are 50 values. Click on anything that vibes with your idea of your business. In the next step, we'll turn that into cards and swipe it down to 3–7.<\u002Fdiv>\n        <div style=\"border-top:2px solid var(--color-neutral-300);border-bottom:2px solid var(--color-neutral-300);padding:14px 0;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:8px;\">Selected ({{ selectedCount }})<\u002Fdiv>\n          <sc-if value=\"{{ hasSelection }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n              <sc-for list=\"{{ selectedChips }}\" as=\"chip\" hint-placeholder-count=\"4\">\n                <span sc-camel-on-click=\"{{ chip.onRemove }}\" class=\"tag tag-accent\" style=\"cursor:pointer;\">{{ chip.label }} ×<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noSelection }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:400 13px var(--font-body);color:var(--color-neutral-500);\">Nothing selected yet.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;\">\n          <input class=\"input\" type=\"text\" placeholder=\"Write your own value...\" value=\"{{ customDraft }}\" sc-camel-on-change=\"{{ onCustomChange }}\" sc-camel-on-key-down=\"{{ onCustomKeyDown }}\" style=\"flex:1;\">\n          <button sc-camel-on-click=\"{{ onCustomAdd }}\" class=\"btn btn-secondary\">Add<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-top:4px;\">Or pick from this list<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n          <sc-for list=\"{{ curatedChips }}\" as=\"chip\" hint-placeholder-count=\"12\">\n            <span sc-camel-on-click=\"{{ chip.onToggle }}\" class=\"{{ chip.className }}\" style=\"cursor:pointer;\">{{ chip.label }}<\u002Fspan>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showNarrow }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;height:100%;\">\n        <sc-if value=\"{{ showNarrowIntro }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center;padding-top:12px;\">\n            <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">The Values Round<\u002Fdiv>\n            <div style=\"font:400 14px/1.6 var(--font-body);color:var(--color-neutral-700);max-width:280px;\">Here are great business values, you start with {{ deckSize }}. Your target is 3–7. If you vibe with it, swipe right. If not, swipe left.<\u002Fdiv>\n            <div style=\"display:flex;align-items:center;gap:16px;width:100%;justify-content:center;\">\n              <div style=\"font:700 12px var(--font-heading);color:var(--color-neutral-600);width:52px;text-align:right;\">← Pass<\u002Fdiv>\n              <div style=\"width:80px;display:flex;justify-content:center;\">\n                <div class=\"narrow-demo-card\" style=\"width:70px;height:70px;background:var(--color-bg);border:2px solid var(--color-text);\"><\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font:700 12px var(--font-heading);color:var(--color-accent);width:52px;text-align:left;\">Vibe →<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);max-width:280px;\">Remember, the challenge is to get rid of them and get to the core of your business values. Everything you keep moves to the next round — rounds repeat until you're at 3–7. (You can add your own later if you don't see them.)<\u002Fdiv>\n            <button sc-camel-on-click=\"{{ onStartNarrowRound }}\" class=\"btn btn-primary btn-block\">Start Swiping<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ narrowMainVisible }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Round {{ round }}<\u002Fdiv>\n          <sc-if value=\"{{ swipeActive }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Swipe right if you vibe with it, left if you don't.<\u002Fdiv>\n            <div>\n              <div style=\"display:flex;justify-content:space-between;font:600 11px var(--font-body);color:var(--color-neutral-500);margin-bottom:4px;\"><span>{{ keptCount }} kept so far<\u002Fspan><span>{{ roundPositionLabel }}<\u002Fspan><\u002Fdiv>\n              <div style=\"height:2px;background:var(--color-neutral-300);\"><div style=\"height:2px;background:var(--color-accent);width:{{ roundProgressPct }}%;\"><\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:relative;width:100%;height:370px;margin:4px 0 4px;\">\n              <sc-for list=\"{{ stackCards }}\" as=\"card\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-pointer-down=\"{{ card.onDown }}\" sc-camel-on-pointer-move=\"{{ card.onMove }}\" sc-camel-on-pointer-up=\"{{ card.onUp }}\" sc-camel-on-pointer-leave=\"{{ card.onUp }}\" style=\"position:absolute;inset:0;background:var(--color-bg);border:2px solid var(--color-text);display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;transform:{{ card.transform }};z-index:{{ card.z }};transition:{{ card.transition }};opacity:{{ card.opacity }};touch-action:none;user-select:none;\">\n                  <div style=\"font:700 28px/1.15 var(--font-heading);text-align:center;color:var(--color-text);\">{{ card.label }}<\u002Fdiv>\n                  <sc-if value=\"{{ card.isFront }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:absolute;top:16px;left:16px;font:700 13px var(--font-heading);color:var(--color-accent);opacity:{{ card.keepOpacity }};border:2px solid var(--color-accent);padding:4px 10px;transform:rotate(-8deg);\">VIBE<\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ card.isFront }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:absolute;top:16px;right:16px;font:700 13px var(--font-heading);color:var(--color-neutral-600);opacity:{{ card.discardOpacity }};border:2px solid var(--color-neutral-600);padding:4px 10px;transform:rotate(8deg);\">PASS<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;\">\n              <button sc-camel-on-click=\"{{ onDiscard }}\" class=\"btn btn-secondary btn-block\">✕ Pass<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onKeep }}\" class=\"btn btn-primary btn-block\">✓ Vibe<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ swipeRoundDone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:400 14px/1.6 var(--font-body);color:var(--color-neutral-700);\">Down to {{ keptCount }} values. {{ passMessage }}<\u002Fdiv>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n              <sc-for list=\"{{ keptChipsDisplay }}\" as=\"chip\" hint-placeholder-count=\"6\">\n                <span class=\"tag tag-accent\">{{ chip.label }}<\u002Fspan>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showRank }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Rank your values<\u002Fdiv>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Use the arrows to reorder, most important first. The line marks your final cut.<\u002Fdiv>\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);white-space:nowrap;\">Keep top {{ topCount }}<\u002Fdiv>\n          <input type=\"range\" min=\"3\" max=\"10\" value=\"{{ topCount }}\" sc-camel-on-change=\"{{ onTopCountChange }}\" style=\"flex:1;\">\n        <\u002Fdiv>\n        <sc-for list=\"{{ rankItems }}\" as=\"item\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:{{ item.borderStyle }};opacity:{{ item.opacity }};background:{{ item.bg }};\">\n            <div style=\"font:700 16px var(--font-heading);color:{{ item.numColor }};width:24px;\">{{ item.num }}<\u002Fdiv>\n            <div style=\"font:600 14px var(--font-body);color:var(--color-text);flex:1;\">{{ item.label }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:2px;\">\n              <button sc-camel-on-click=\"{{ item.onUp }}\" class=\"btn btn-secondary btn-icon\" disabled=\"{{ item.isFirst }}\" style=\"width:32px;height:26px;padding:0;\">↑<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ item.onDown }}\" class=\"btn btn-secondary btn-icon\" disabled=\"{{ item.isLast }}\" style=\"width:32px;height:26px;padding:0;\">↓<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showReflection }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:18px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Review &amp; wrap-up<\u002Fdiv>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">A few final questions to turn this into action.<\u002Fdiv>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">1. What did you learn about yourself or your business while doing this exercise?<\u002Fdiv>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ reflLearned }}\" sc-camel-on-change=\"{{ onReflLearned }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">2. Did anything surprise you?<\u002Fdiv>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ reflSurprises }}\" sc-camel-on-change=\"{{ onReflSurprises }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:8px;\">3. What could you...<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <input class=\"input\" type=\"text\" placeholder=\"Stop doing\" value=\"{{ reflStop }}\" sc-camel-on-change=\"{{ onReflStop }}\">\n            <input class=\"input\" type=\"text\" placeholder=\"Do less of\" value=\"{{ reflLess }}\" sc-camel-on-change=\"{{ onReflLess }}\">\n            <input class=\"input\" type=\"text\" placeholder=\"Do more of\" value=\"{{ reflMore }}\" sc-camel-on-change=\"{{ onReflMore }}\">\n            <input class=\"input\" type=\"text\" placeholder=\"Continue doing\" value=\"{{ reflContinue }}\" sc-camel-on-change=\"{{ onReflContinue }}\">\n            <input class=\"input\" type=\"text\" placeholder=\"Start doing\" value=\"{{ reflStart }}\" sc-camel-on-change=\"{{ onReflStart }}\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">4. What is essential for this business — the thing it can never compromise on?<\u002Fdiv>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ reflEssential }}\" sc-camel-on-change=\"{{ onReflEssential }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">5. What must this business avoid — the thing that would break trust or go against its values?<\u002Fdiv>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ reflAvoid }}\" sc-camel-on-change=\"{{ onReflAvoid }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">6. In 3 years, fully aligned with these values, what does success look like?<\u002Fdiv>\n          <textarea class=\"input\" rows=\"3\" value=\"{{ reflThreeYear }}\" sc-camel-on-change=\"{{ onReflThreeYear }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">7. Make a promise to yourself: what's one action you can take based on what you learned about yourself and your business, and when are you going to do it by?<\u002Fdiv>\n          <div style=\"display:flex;gap:8px;\">\n            <input class=\"input\" type=\"text\" placeholder=\"Action\" value=\"{{ reflAction }}\" sc-camel-on-change=\"{{ onReflAction }}\" style=\"flex:2;\">\n            <input class=\"input\" type=\"text\" placeholder=\"By when\" value=\"{{ reflByWhen }}\" sc-camel-on-change=\"{{ onReflByWhen }}\" style=\"flex:1;\">\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showStatement }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\" id=\"statement-capture\">\n        <div style=\"height:2px;background:var(--color-accent);width:56px;\"><\u002Fdiv>\n        <input class=\"input\" type=\"text\" placeholder=\"Your business name\" value=\"{{ businessName }}\" sc-camel-on-change=\"{{ onBusinessNameChange }}\" style=\"font:700 20px var(--font-heading);border:none;border-bottom:2px solid var(--color-neutral-300);padding:4px 0;background:none;\">\n        <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);\">Business Values Statement<\u002Fdiv>\n        <div style=\"border-top:2px solid var(--color-text);\"><\u002Fdiv>\n\n        <sc-if value=\"{{ isGeneratingStatement }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0;text-align:center;\">\n            <div style=\"width:32px;height:32px;border:2px solid var(--color-neutral-300);border-top:2px solid var(--color-accent);border-radius:50%;animation:om-spin 0.9s linear infinite;\"><\u002Fdiv>\n            <div style=\"font:400 13px var(--font-body);color:var(--color-neutral-600);\">Writing your mission statement and value descriptions...<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasGenerateError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:400 12px var(--font-body);color:var(--color-accent-700);\">{{ generateError }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onGenerateStatement }}\" class=\"btn btn-secondary\">Try Again<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasMissionStatement }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:400 15px/1.65 var(--font-body);color:var(--color-text);\">{{ missionStatement }}<\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ needsGenerateButton }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ onGenerateStatement }}\" class=\"btn btn-secondary\">Write My Statement<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <sc-for list=\"{{ statementValues }}\" as=\"v\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;gap:12px;padding:12px 0;border-bottom:2px solid var(--color-neutral-300);\">\n            <div style=\"font:700 18px var(--font-heading);color:var(--color-accent);width:24px;\">{{ v.num }}<\u002Fdiv>\n            <div style=\"flex:1;\">\n              <div style=\"font:700 15px var(--font-heading);color:var(--color-text);\">{{ v.label }}<\u002Fdiv>\n              <div style=\"font:400 13px/1.55 var(--font-body);color:var(--color-neutral-700);margin-top:4px;\">{{ v.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-700);\">What's essential<\u002Fdiv>\n          <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-text);\">{{ reflEssentialDisplay }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-700);\">What to avoid<\u002Fdiv>\n          <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-text);\">{{ reflAvoidDisplay }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:var(--color-accent);padding:16px;display:flex;flex-direction:column;gap:4px;\">\n          <div style=\"font:600 10px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:#fff;opacity:0.85;\">My promise to myself<\u002Fdiv>\n          <div style=\"font:700 15px var(--font-heading);color:#fff;\">{{ reflActionDisplay }}<\u002Fdiv>\n          <div style=\"font:400 12px var(--font-body);color:#fff;opacity:0.85;\">by {{ reflByWhenDisplay }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:16px;display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);\">Save this statement<\u002Fdiv>\n          <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-600);\">Take a screenshot to keep it, or enter your email and we'll send you a copy.<\u002Fdiv>\n          <sc-if value=\"{{ emailSent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:600 13px var(--font-body);color:var(--color-accent-700);\">Sent to {{ emailValue }}.<\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ emailSent }}\" hint-placeholder-val=\"{{ true }}\">\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:8px;\">\n            <input class=\"input\" type=\"email\" placeholder=\"you@business.com\" value=\"{{ emailValue }}\" sc-camel-on-change=\"{{ onEmailChange }}\" style=\"flex:1;\">\n            <button sc-camel-on-click=\"{{ onSendEmail }}\" class=\"btn btn-secondary\" disabled=\"{{ emailSendDisabled }}\">Email Me<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ onGoToPerfectClient }}\" class=\"btn btn-primary btn-block\">Next: Define Your Perfect Client<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onPrint }}\" class=\"btn btn-secondary btn-block\">Print / Export<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetAll }}\" class=\"btn btn-ghost btn-block\">Start Over<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showPerfectClient }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Define your perfect client<\u002Fdiv>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Pick the option that fits best, or write your own.<\u002Fdiv>\n        <sc-for list=\"{{ pcPersonaBlocks }}\" as=\"persona\" hint-placeholder-count=\"1\">\n          <div style=\"border-top:2px solid var(--color-text);padding-top:14px;\">\n            <div style=\"font:700 13px var(--font-heading);letter-spacing:0.04em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:10px;\">{{ persona.heading }}<\u002Fdiv>\n            <div style=\"margin-bottom:14px;\">\n              <div style=\"font:600 13px var(--font-body);color:var(--color-text);margin-bottom:10px;\">Give them a name<\u002Fdiv>\n              <input class=\"input\" type=\"text\" placeholder=\"e.g. Sarah\" value=\"{{ persona.name }}\" sc-camel-on-change=\"{{ persona.onNameChange }}\" style=\"width:100%;box-sizing:border-box;\">\n            <\u002Fdiv>\n            <sc-for list=\"{{ persona.questions }}\" as=\"q\" hint-placeholder-count=\"7\">\n              <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;margin-bottom:14px;\">\n                <div style=\"font:600 13px var(--font-body);color:var(--color-text);margin-bottom:10px;\">{{ q.text }}<\u002Fdiv>\n                <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                  <sc-for list=\"{{ q.options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                    <div sc-camel-on-click=\"{{ opt.onSelect }}\" class=\"{{ opt.className }}\" style=\"padding:10px 12px;font:400 13px var(--font-body);cursor:pointer;\">{{ opt.label }}<\u002Fdiv>\n                  <\u002Fsc-for>\n                  <div sc-camel-on-click=\"{{ q.onSelectOther }}\" class=\"{{ q.otherClassName }}\" style=\"padding:10px 12px;font:400 13px var(--font-body);cursor:pointer;\">Other<\u002Fdiv>\n                  <sc-if value=\"{{ q.showOtherInput }}\" hint-placeholder-val=\"{{ false }}\">\n                    <input class=\"input\" type=\"text\" placeholder=\"Write your own...\" value=\"{{ q.otherValue }}\" sc-camel-on-change=\"{{ q.onOtherChange }}\" style=\"width:100%;box-sizing:border-box;\">\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ persona.showRemove }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ onRemoveSecondPersona }}\" class=\"btn btn-ghost\">Remove this dream client<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <sc-if value=\"{{ showAddSecondPersona }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ onAddSecondPersona }}\" class=\"btn btn-secondary btn-block\">+ Add a second dream client (different niche)<\u002Fbutton>\n        <\u002Fsc-if>\n        <div style=\"display:flex;gap:10px;padding-top:4px;\">\n          <button sc-camel-on-click=\"{{ onBackFromPc }}\" class=\"btn btn-secondary\">Back<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ onContinueFromPc }}\" class=\"btn btn-primary btn-block\" disabled=\"{{ pcContinueDisabled }}\">Continue<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showWrapup }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"height:2px;background:var(--color-accent);width:56px;\"><\u002Fdiv>\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">You're all set for now<\u002Fdiv>\n        <div style=\"font:400 14px/1.6 var(--font-body);color:var(--color-neutral-700);\">You've defined your business values and your perfect client. Next: the granular details your team or AI needs to answer questions, then a guided brand voice interview.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onGoToBizDetails }}\" class=\"btn btn-primary btn-block\">Add Business Details<\u002Fbutton>\n        <div style=\"display:flex;gap:10px;\">\n          <button sc-camel-on-click=\"{{ onBackFromPc }}\" class=\"btn btn-secondary\">Back<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ resetAll }}\" class=\"btn btn-ghost btn-block\">Start Over<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showBizDetails }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Business details<\u002Fdiv>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">The granular stuff — hours, areas served, policies, FAQs. This is what lets your team or an AI answer real questions accurately.<\u002Fdiv>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Tagline<\u002Fdiv>\n          <input class=\"input\" type=\"text\" placeholder=\"A short line describing what you do\" value=\"{{ biz.tagline }}\" sc-camel-on-change=\"{{ onBizTaglineChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">What do you do, in plain terms?<\u002Fdiv>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ biz.whatYouDo }}\" sc-camel-on-change=\"{{ onBizWhatYouDoChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Hours of operation<\u002Fdiv>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Mon–Fri 9am–5pm\" value=\"{{ biz.hoursText }}\" sc-camel-on-change=\"{{ onBizHoursTextChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Days off / holidays / blackout dates<\u002Fdiv>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Weekends, major holidays\" value=\"{{ biz.daysOff }}\" sc-camel-on-change=\"{{ onBizDaysOffChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Where are you located?<\u002Fdiv>\n          <input class=\"input\" type=\"text\" placeholder=\"City, region, or address\" value=\"{{ biz.location }}\" sc-camel-on-change=\"{{ onBizLocationChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Areas served<\u002Fdiv>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Greater Boston, or nationwide\" value=\"{{ biz.areasServed }}\" sc-camel-on-change=\"{{ onBizAreasServedChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:10px;\">Do you work in-person, remote, or both?<\u002Fdiv>\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <sc-for list=\"{{ reachOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ opt.onSelect }}\" class=\"{{ opt.className }}\" style=\"padding:10px 12px;font:400 13px var(--font-body);cursor:pointer;\">{{ opt.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n            <div sc-camel-on-click=\"{{ onSelectReachOther }}\" class=\"{{ reachOtherClassName }}\" style=\"padding:10px 12px;font:400 13px var(--font-body);cursor:pointer;\">Other<\u002Fdiv>\n            <sc-if value=\"{{ reachOtherActive }}\" hint-placeholder-val=\"{{ false }}\">\n              <input class=\"input\" type=\"text\" placeholder=\"Describe it...\" value=\"{{ biz.reachOther }}\" sc-camel-on-change=\"{{ onReachOtherChange }}\" style=\"width:100%;box-sizing:border-box;\">\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Phone<\u002Fdiv>\n          <input class=\"input\" type=\"text\" value=\"{{ biz.phone }}\" sc-camel-on-change=\"{{ onBizPhoneChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Email<\u002Fdiv>\n          <input class=\"input\" type=\"text\" value=\"{{ biz.email }}\" sc-camel-on-change=\"{{ onBizEmailChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Website<\u002Fdiv>\n          <input class=\"input\" type=\"text\" value=\"{{ biz.website }}\" sc-camel-on-change=\"{{ onBizWebsiteChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Booking / scheduling link<\u002Fdiv>\n          <input class=\"input\" type=\"text\" value=\"{{ biz.bookingLink }}\" sc-camel-on-change=\"{{ onBizBookingLinkChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Payment methods accepted<\u002Fdiv>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Card, cash, invoice, Venmo\" value=\"{{ biz.paymentMethods }}\" sc-camel-on-change=\"{{ onBizPaymentMethodsChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Pricing model<\u002Fdiv>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Hourly, flat-fee, subscription\" value=\"{{ biz.pricingModel }}\" sc-camel-on-change=\"{{ onBizPricingModelChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Price range<\u002Fdiv>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. $150–$400 per project\" value=\"{{ biz.priceRange }}\" sc-camel-on-change=\"{{ onBizPriceRangeChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Cancellation / refund policy<\u002Fdiv>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ biz.cancellationPolicy }}\" sc-camel-on-change=\"{{ onBizCancellationPolicyChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Guarantee / warranty<\u002Fdiv>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ biz.guarantee }}\" sc-camel-on-change=\"{{ onBizGuaranteeChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Team size<\u002Fdiv>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Just me, or 12 employees\" value=\"{{ biz.teamSize }}\" sc-camel-on-change=\"{{ onBizTeamSizeChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\u002Fdiv>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Anything else we should know?<\u002Fdiv>\n          <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-600);margin-bottom:6px;\">Deposit requirements, artwork/proof policies, rescheduling rules, licensing, insurance, anything else that comes up but doesn't fit above.<\u002Fdiv>\n          <textarea class=\"input\" rows=\"3\" value=\"{{ biz.otherPolicies }}\" sc-camel-on-change=\"{{ onBizOtherPoliciesChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n        <\u002Fdiv>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:10px;\">Frequently asked questions<\u002Fdiv>\n          <sc-for list=\"{{ faqBlocks }}\" as=\"f\" hint-placeholder-count=\"1\">\n            <div style=\"margin-bottom:12px;padding-bottom:12px;border-bottom:2px solid var(--color-neutral-300);\">\n              <input class=\"input\" type=\"text\" placeholder=\"Question\" value=\"{{ f.q }}\" sc-camel-on-change=\"{{ f.onQChange }}\" style=\"width:100%;box-sizing:border-box;margin-bottom:6px;\">\n              <textarea class=\"input\" rows=\"2\" placeholder=\"Answer\" value=\"{{ f.a }}\" sc-camel-on-change=\"{{ f.onAChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\u002Ftextarea>\n              <sc-if value=\"{{ f.showRemove }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ f.onRemove }}\" class=\"btn btn-ghost\" style=\"margin-top:6px;\">Remove<\u002Fbutton>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <button sc-camel-on-click=\"{{ onAddFaq }}\" class=\"btn btn-secondary btn-block\">+ Add another FAQ<\u002Fbutton>\n        <\u002Fdiv>\n\n        <button sc-camel-on-click=\"{{ onContinueFromBizDetails }}\" class=\"btn btn-primary btn-block\">Continue to Brand Voice Interview<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showInterview }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;height:100%;min-height:520px;\">\n        <div style=\"font:700 20px/1.2 var(--font-heading);color:var(--color-text);margin-bottom:4px;\">Brand Voice Interview<\u002Fdiv>\n        <div style=\"font:400 12px var(--font-body);color:var(--color-neutral-600);margin-bottom:14px;\">Question {{ chatDisplayIndex }} of {{ chatTotal }}<\u002Fdiv>\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:12px;\">\n          <sc-for list=\"{{ chatMessages }}\" as=\"msg\" hint-placeholder-count=\"2\">\n            <div style=\"align-self:{{ msg.align }};max-width:85%;background:{{ msg.bg }};color:{{ msg.color }};padding:10px 14px;font:400 13px/1.5 var(--font-body);\">{{ msg.text }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-if value=\"{{ isGeneratingGuide }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 0;text-align:center;\">\n            <div style=\"width:32px;height:32px;border:2px solid var(--color-neutral-300);border-top:2px solid var(--color-accent);border-radius:50%;animation:om-spin 0.9s linear infinite;\"><\u002Fdiv>\n            <div style=\"font:400 13px var(--font-body);color:var(--color-neutral-600);\">Writing your brand guide from everything you've shared...<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasGuideError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:400 12px var(--font-body);color:var(--color-accent-700);\">{{ guideError }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onRetryGuide }}\" class=\"btn btn-secondary\">Try Again<\u002Fbutton>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ interviewInProgress }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border-top:2px solid var(--color-neutral-300);margin-top:14px;padding-top:16px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n            <sc-if value=\"{{ hasMic }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ onMicToggle }}\" class=\"btn btn-icon\" style=\"width:64px;height:64px;border-radius:50%;{{ micButtonStyle }}\">{{ micIcon }}<\u002Fbutton>\n              <div style=\"font:600 12px var(--font-body);color:var(--color-neutral-600);\">{{ micStatusText }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ chatDraftHasText }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;background:var(--color-neutral-200);padding:10px 12px;font:400 13px/1.5 var(--font-body);color:var(--color-text);\">{{ chatDraft }}<\u002Fdiv>\n            <\u002Fsc-if>\n            <div style=\"display:flex;gap:8px;width:100%;\">\n              <button sc-camel-on-click=\"{{ onToggleTypeInstead }}\" class=\"btn btn-secondary btn-block\">{{ typeToggleLabel }}<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ onSendAnswer }}\" class=\"btn btn-primary btn-block\" disabled=\"{{ sendDisabled }}\">Send<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-if value=\"{{ showTypeInput }}\" hint-placeholder-val=\"{{ false }}\">\n              <textarea class=\"input\" rows=\"2\" placeholder=\"Type your answer...\" value=\"{{ chatDraft }}\" sc-camel-on-change=\"{{ onChatDraftChange }}\" sc-camel-on-key-down=\"{{ onChatKeyDown }}\" style=\"width:100%;box-sizing:border-box;resize:none;\"><\u002Ftextarea>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showVisual }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Fonts, colors &amp; logo<\u002Fdiv>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Pick the direction that fits, or keep exploring — you can regenerate the logo idea below.<\u002Fdiv>\n\n        <sc-if value=\"{{ isGeneratingVisual }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0;text-align:center;\">\n            <div style=\"width:32px;height:32px;border:2px solid var(--color-neutral-300);border-top:2px solid var(--color-accent);border-radius:50%;animation:om-spin 0.9s linear infinite;\"><\u002Fdiv>\n            <div style=\"font:400 13px var(--font-body);color:var(--color-neutral-600);\">Suggesting palettes and font pairings...<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ hasVisualError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:400 12px var(--font-body);color:var(--color-accent-700);\">{{ visualError }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onRetryVisual }}\" class=\"btn btn-secondary\">Try Again<\u002Fbutton>\n        <\u002Fsc-if>\n\n        <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);\">Colors<\u002Fdiv>\n        <sc-for list=\"{{ visualPalettes }}\" as=\"pal\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ pal.onChoose }}\" style=\"{{ pal.cardStyle }}padding:12px;cursor:pointer;display:flex;gap:8px;\">\n            <sc-for list=\"{{ pal.colors }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div style=\"flex:1;\">\n                <div style=\"width:100%;height:44px;background:{{ c.hex }};\"><\u002Fdiv>\n                <div style=\"font:600 10px var(--font-body);color:var(--color-text);margin-top:4px;\">{{ c.name }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);margin-top:6px;\">Fonts<\u002Fdiv>\n        <sc-for list=\"{{ visualFontPairings }}\" as=\"f\" hint-placeholder-count=\"3\">\n          <div sc-camel-on-click=\"{{ f.onChoose }}\" style=\"{{ f.cardStyle }}padding:12px;cursor:pointer;\">\n            <div style=\"font-size:19px;font-weight:700;color:var(--color-text);{{ f.headingFontStyle }}\">{{ f.heading }}<\u002Fdiv>\n            <div style=\"font-size:14px;color:var(--color-neutral-700);{{ f.bodyFontStyle }}\">{{ f.body }} — The quick brown fox jumps over the lazy dog.<\u002Fdiv>\n            <div style=\"font:400 11px/1.4 var(--font-body);color:var(--color-neutral-500);margin-top:4px;\">{{ f.rationale }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n\n        <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);margin-top:6px;\">Logo concept<\u002Fdiv>\n        <div style=\"border:2px solid var(--color-neutral-300);padding:12px;font:400 13px/1.55 var(--font-body);color:var(--color-text);\">{{ visualLogoConcept }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onRegenerateLogo }}\" class=\"btn btn-secondary\" disabled=\"{{ regeneratingLogo }}\">Regenerate logo idea<\u002Fbutton>\n\n        <button sc-camel-on-click=\"{{ onContinueFromVisual }}\" class=\"btn btn-primary btn-block\" style=\"margin-top:8px;\">Continue to Brand Guide<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showGuide }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"height:2px;background:var(--color-accent);width:56px;\"><\u002Fdiv>\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">{{ businessName }} Brand Guide<\u002Fdiv>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;padding-bottom:4px;\">\n          <span sc-camel-on-click=\"{{ scrollToValues }}\" class=\"tag tag-outline\" style=\"cursor:pointer;white-space:nowrap;\">Values<\u002Fspan>\n          <span sc-camel-on-click=\"{{ scrollToClient }}\" class=\"tag tag-outline\" style=\"cursor:pointer;white-space:nowrap;\">Client<\u002Fspan>\n          <span sc-camel-on-click=\"{{ scrollToDetails }}\" class=\"tag tag-outline\" style=\"cursor:pointer;white-space:nowrap;\">Details<\u002Fspan>\n          <span sc-camel-on-click=\"{{ scrollToVoice }}\" class=\"tag tag-outline\" style=\"cursor:pointer;white-space:nowrap;\">Voice<\u002Fspan>\n          <span sc-camel-on-click=\"{{ scrollToMessaging }}\" class=\"tag tag-outline\" style=\"cursor:pointer;white-space:nowrap;\">Messaging<\u002Fspan>\n          <span sc-camel-on-click=\"{{ scrollToVisual }}\" class=\"tag tag-outline\" style=\"cursor:pointer;white-space:nowrap;\">Visual<\u002Fspan>\n          <span sc-camel-on-click=\"{{ scrollToDoDont }}\" class=\"tag tag-outline\" style=\"cursor:pointer;white-space:nowrap;\">Do/Don't<\u002Fspan>\n        <\u002Fdiv>\n\n        <div id=\"sec-values\" style=\"border-top:2px solid var(--color-text);padding-top:14px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px;\">Core Values<\u002Fdiv>\n          <div style=\"font:400 14px/1.6 var(--font-body);color:var(--color-text);margin-bottom:10px;\">{{ missionStatement }}<\u002Fdiv>\n          <sc-for list=\"{{ statementValues }}\" as=\"v\" hint-placeholder-count=\"5\">\n            <div style=\"padding:8px 0;border-bottom:2px solid var(--color-neutral-300);\">\n              <div style=\"font:700 14px var(--font-heading);color:var(--color-text);\">{{ v.num }}. {{ v.label }}<\u002Fdiv>\n              <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-700);\">{{ v.note }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div id=\"sec-client\" style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px;\">Perfect Client<\u002Fdiv>\n          <sc-for list=\"{{ guidePersonas }}\" as=\"p\" hint-placeholder-count=\"1\">\n            <div style=\"font:700 13px var(--font-body);color:var(--color-text);margin-bottom:2px;\">{{ p.name }}<\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div id=\"sec-details\" style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px;\">Business Details<\u002Fdiv>\n          <div style=\"font:400 13px/1.7 var(--font-body);color:var(--color-text);\">\n            <div><b>Hours:<\u002Fb> {{ biz.hoursText }}<\u002Fdiv>\n            <div><b>Days off:<\u002Fb> {{ biz.daysOff }}<\u002Fdiv>\n            <div><b>Location:<\u002Fb> {{ biz.location }}<\u002Fdiv>\n            <div><b>Areas served:<\u002Fb> {{ biz.areasServed }}<\u002Fdiv>\n            <div><b>Contact:<\u002Fb> {{ biz.phone }} {{ biz.email }} {{ biz.website }}<\u002Fdiv>\n            <div><b>Payment:<\u002Fb> {{ biz.paymentMethods }}<\u002Fdiv>\n            <div><b>Pricing:<\u002Fb> {{ biz.pricingModel }}, {{ biz.priceRange }}<\u002Fdiv>\n            <div><b>Cancellation policy:<\u002Fb> {{ biz.cancellationPolicy }}<\u002Fdiv>\n            <div><b>Guarantee:<\u002Fb> {{ biz.guarantee }}<\u002Fdiv>\n            <div><b>Team size:<\u002Fb> {{ biz.teamSize }}<\u002Fdiv>\n            <div><b>Other policies:<\u002Fb> {{ biz.otherPolicies }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font:600 11px var(--font-body);color:var(--color-neutral-600);margin-top:10px;margin-bottom:6px;\">FAQs<\u002Fdiv>\n          <sc-for list=\"{{ guideFaqs }}\" as=\"f\" hint-placeholder-count=\"2\">\n            <div style=\"padding:6px 0;border-bottom:2px solid var(--color-neutral-300);\">\n              <div style=\"font:700 12px var(--font-body);color:var(--color-text);\">{{ f.q }}<\u002Fdiv>\n              <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-700);\">{{ f.a }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div id=\"sec-voice\" style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px;\">Brand Voice<\u002Fdiv>\n          <div style=\"font:400 13px/1.6 var(--font-body);color:var(--color-text);margin-bottom:10px;\">{{ guide.toneSummary }}<\u002Fdiv>\n          <div style=\"display:flex;gap:16px;flex-wrap:wrap;\">\n            <div style=\"flex:1;min-width:140px;\">\n              <div style=\"font:600 11px var(--font-body);color:var(--color-neutral-600);margin-bottom:6px;\">Use<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n                <sc-for list=\"{{ guideVocabUse }}\" as=\"w\" hint-placeholder-count=\"4\">\n                  <span class=\"tag tag-accent\">{{ w }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"flex:1;min-width:140px;\">\n              <div style=\"font:600 11px var(--font-body);color:var(--color-neutral-600);margin-bottom:6px;\">Avoid<\u002Fdiv>\n              <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n                <sc-for list=\"{{ guideVocabAvoid }}\" as=\"w\" hint-placeholder-count=\"3\">\n                  <span class=\"tag tag-neutral\">{{ w }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"sec-messaging\" style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px;\">Messaging<\u002Fdiv>\n          <sc-for list=\"{{ guidePillars }}\" as=\"pillar\" hint-placeholder-count=\"3\">\n            <div style=\"padding:8px 0;border-bottom:2px solid var(--color-neutral-300);\">\n              <div style=\"font:700 13px var(--font-heading);color:var(--color-text);\">{{ pillar.title }}<\u002Fdiv>\n              <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-700);\">{{ pillar.desc }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"margin-top:10px;\">\n            <div style=\"font:600 11px var(--font-body);color:var(--color-neutral-600);margin-bottom:4px;\">Differentiation<\u002Fdiv>\n            <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-text);\">{{ guide.differentiation }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:10px;\">\n            <div style=\"font:600 11px var(--font-body);color:var(--color-neutral-600);margin-bottom:4px;\">Origin Story<\u002Fdiv>\n            <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-text);\">{{ guide.originStory }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"sec-visual\" style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px;\">Visual Identity (suggested)<\u002Fdiv>\n          <div style=\"displ
