sApp_v1';\n\nfunction defaultState(){\n  return {\n    screen: 'welcome',\n    contact: {yourName:'', phone:'', email:'', businessName:'', website:'', social:''},\n    lifeSubIdx: 0,\n    lifeRatings: LIFE_AREAS.map(()=>''),\n    lifeNotes: LIFE_AREAS.map(()=>''),\n    themesNote: '', dislikeNote: '', workNotes: {},\n    selectedIds: [], customItems: [], customDraft: '',\n    narrowIntroSeen: false,\n    round: 1, swipeQueue: [], swipeIndex: 0, kept: [], discarded: [],\n    swipeDragX: 0, swipeDragging: false, swipeAnimating: false,\n    rankList: [], topCount: 7, dragIndex: null,\n    reflLearned:'', reflSurprises:'', reflStop:'', reflLess:'', reflMore:'', reflContinue:'', reflStart:'',\n    reflEssential:'', reflAvoid:'', reflThreeYear:'', reflAction:'', reflByWhen:'',\n    businessName:'', statementNotes: {}, missionStatement:'', generatingStatement:false, generateError:'',\n    emailOptIn:false, emailSent:false,\n    pcPersonas: [{name:'', answers:{}, otherValues:{}, otherActive:{}}],\n    interviewIdx: 0, interviewMessages: [], interviewAnswers: {}, interviewDraft: '', micListening: false, showTypeInput: false,\n    guide: null, generatingGuide: false, guideError: '',\n    visualOptions: null, generatingVisual: false, visualError: '', chosenPaletteIdx: 0, chosenFontIdx: 0, regeneratingLogo: false,\n    biz: {tagline:'', whatYouDo:'', hoursText:'', daysOff:'', areasServed:'', location:'', reachType:'', reachOther:'',\n      phone:'', email:'', website:'', bookingLink:'', paymentMethods:'', pricingModel:'', priceRange:'',\n      cancellationPolicy:'', guarantee:'', teamSize:'', otherPolicies:''},\n    faqs: [{q:'', a:''}],\n    stagesSent: {},\n    ghlWebhookUrl: GHL_WEBHOOK_URL,\n    theme: 'light'\n  };\n}\n\nconst PC_QUESTIONS = [\n  {id:'age', text:\"What's their age range?\", options:['Under 25','25–35','35–45','45–55','55–65','65+']},\n  {id:'gender', text:\"What's their gender?\", options:['Woman','Man','Non-binary']},\n  {id:'role', text:'What is their job type?', options:['Solo entrepreneur or founder','Manager or team lead','Executive or senior decision-maker']},\n  {id:'pain', text:\"What's their biggest pain point when they find you?\", options:[\"They're overwhelmed and need it handled\",\"They know what they want but lack the time or skill\",\"They've been burned by someone before\"]},\n  {id:'value', text:'What do they value most when choosing who to work with?', options:['Speed and responsiveness','Deep expertise and quality','Trust and relationship']},\n  {id:'decide', text:'How do they make decisions?', options:['Fast, gut-driven','Careful, researches everything first','Needs buy-in from others']},\n  {id:'why', text:'Why would they choose you over a competitor?', options:['Better results','Better experience or relationship','Better value or price']}\n];\n\n// Lead capture (fires when they submit contact details).\nconst GHL_WEBHOOK_URL = 'https://services.leadconnectorhq.com/hooks/fkyVaCUPjbDUBzUopuLP/webhook-trigger/vxs7ZujODmAAQwEC6SvK';\n// Completion / guide delivery. Set this to a second trigger's URL to split\n// completions off; empty means everything posts to the hook above.\nconst GHL_COMPLETION_WEBHOOK_URL = '';\n\nconst PC_LABELS = [\n  {id:'age', label:'Age'}, {id:'gender', label:'Gender'}, {id:'role', label:'Job'},\n  {id:'pain', label:'Pain point'}, {id:'value', label:'Values most'},\n  {id:'decide', label:'Decides'}, {id:'why', label:'Chooses you for'}\n];\nfunction pcAnswerText(p, id){\n  const a = (p.answers||{})[id] || '';\n  if(a === 'Other' || a === 'other'){ return ((p.otherValues||{})[id] || '').trim(); }\n  return String(a).trim();\n}\n\nconst INTERVIEW_QUESTIONS = [\n  {id:'persona', prompt:\"If your brand were a person walking into a room, how would they act — confident and bold, or warm and easygoing?\"},\n  {id:'formality', prompt:'How formal is your writing usually — buttoned-up, conversational, or somewhere in between?'},\n  {id:'banned', prompt:\"Any jargon, buzzwords, or phrases you never want to see in your business's writing?\"},\n  {id:'threewords', prompt:\"What are 2-3 words you'd love customers to use to describe you?\"},\n  {id:'coremessage', prompt:'What\\'s the single most important message you want every customer to walk away understanding?'},\n  {id:'pillar', prompt:\"Besides your values, what's a theme your marketing or conversations keep coming back to?\"},\n  {id:'competitor', prompt:\"Who's your biggest competitor or alternative, and what do you do differently?\"},\n  {id:'origin', prompt:'What\\'s the origin story — why did you start this business?'},\n  {id:'moment', prompt:\"What's a moment or story that captures what this business is really about?\"},\n  {id:'colors', prompt:'Do you already have brand colors, or a color feeling in mind? Describe it, even loosely — or say \"not yet\" and we\\'ll suggest some.'},\n  {id:'fonts', prompt:'Do you have a logo or font style already, or should we suggest a direction?'},\n  {id:'dodont', prompt:\"Give an example of something you'd say to a client — and something you'd never say.\"},\n  {id:'neverdo', prompt:'What\\'s one thing this brand should never do, visually or verbally?'},\n  {id:'anything', prompt:'Anything else you want baked into your brand guide?'}\n];\n\nclass Component extends DCLogic {\n  state = defaultState();\n\n  applyTheme(){\n    document.documentElement.setAttribute('data-theme', this.state.theme === 'dark' ? 'dark' : 'light');\n  }\n  componentDidUpdate(_, prevState){\n    if(prevState.theme !== this.state.theme) this.applyTheme();\n  }\n  onToggleTheme = () => {\n    this.setState(s => ({theme: s.theme === 'dark' ? 'light' : 'dark'}), () => this.applyTheme());\n  };\n  componentDidMount(){\n    this.applyTheme();\n    try{\n      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');\n      if(saved){\n        saved.sendingToGhl = false;\n        if(typeof saved.lifeSubIdx === 'number') saved.lifeSubIdx = Math.min(saved.lifeSubIdx, 1);\n        if(!Array.isArray(saved.lifeRatings)) saved.lifeRatings = LIFE_AREAS.map(()=>'');\n        if(!Array.isArray(saved.lifeNotes)) saved.lifeNotes = LIFE_AREAS.map(()=>'');\n        delete saved.lifeData; delete saved.colDrafts;\n      }\n      if(saved) this.setState(saved, () => {\n        if(this.state.screen==='statement' && !this.state.missionStatement && !this.state.generatingStatement) this.generateStatement();\n      });\n    }catch(e){}\n    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n    if(SR){\n      this.recognition = new SR();\n      this.recognition.continuous = false;\n      this.recognition.interimResults = false;\n      this.recognition.onresult = (e) => {\n        const t = e.results[0][0].transcript;\n        this.setState({interviewDraft: (this.state.interviewDraft ? this.state.interviewDraft+' ' : '') + t, micListening:false});\n      };\n      this.recognition.onend = () => { this.setState({micListening:false}); };\n      this.recognition.onerror = () => { this.setState({micListening:false}); };\n    }\n  }\n  componentDidUpdate(prevState){\n    const {dragIndex, swipeDragging, sendingToGhl, ...persist} = this.state;\n    try{ localStorage.setItem(STORE_KEY, JSON.stringify(persist)); }catch(e){}\n    if(this.state.visualOptions && this.state.visualOptions !== prevState.visualOptions){\n      this.loadFontPreviews(this.state.visualOptions.fontPairings);\n    }\n  }\n\n  resetAll = () => { this.setState(defaultState()); };\n\n  // ---- life review ----\n\n  // ---- brainstorm ----\n  toggleCurated = (id) => {\n    const has = this.state.selectedIds.includes(id);\n    this.setState({selectedIds: has ? this.state.selectedIds.filter(x=>x!==id) : this.state.selectedIds.concat(id)});\n  };\n  addCustom = () => {\n    const label = this.state.customDraft.trim();\n    if(!label) return;\n    const id = 'c'+Date.now();\n    this.setState({customItems: this.state.customItems.concat({id,label}), customDraft:''});\n  };\n  removeCustom = (id) => { this.setState({customItems: this.state.customItems.filter(c=>c.id!==id)}); };\n\n  getSelectedLabels = () => {\n    const curated = CURATED.filter(v=>this.state.selectedIds.includes(v.id)).map(v=>v.label);\n    const custom = this.state.customItems.map(c=>c.label);\n    return curated.concat(custom);\n  };\n\n  // ---- narrow (swipe) ----\n  shuffle = (arr) => {\n    const a = arr.slice();\n    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }\n    return a;\n  };\n  onStartNarrowRound = () => {\n    this.setState({narrowIntroSeen:true, round:1, swipeQueue: this.shuffle(this.getSelectedLabels()), swipeIndex:0, kept:[], discarded:[], swipeDragX:0});\n  };\n  commitSwipeDecision = (isKeep) => {\n    const st = this.state;\n    if(st.swipeIndex >= st.swipeQueue.length) return;\n    const label = st.swipeQueue[st.swipeIndex];\n    const kept = isKeep ? st.kept.concat(label) : st.kept;\n    const newIndex = st.swipeIndex+1;\n    if(newIndex >= st.swipeQueue.length && kept.length >= 8){\n      this.setState({swipeQueue: this.shuffle(kept), swipeIndex:0, kept:[], discarded:[], round: st.round+1, swipeDragX:0, swipeDragging:false});\n    } else {\n      this.setState({kept, swipeIndex:newIndex, swipeDragX:0, swipeDragging:false});\n    }\n  };\n  onKeep = () => this.commitSwipeDecision(true);\n  onDiscard = () => this.commitSwipeDecision(false);\n  onCardPointerDown = (e) => { this.setState({swipeDragging:true, dragStartX: e.clientX}); };\n  onCardPointerMove = (e) => {\n    if(!this.state.swipeDragging) return;\n    this.setState({swipeDragX: e.clientX - this.state.dragStartX});\n  };\n  onCardPointerUp = () => {\n    const x = this.state.swipeDragX;\n    if(!this.state.swipeDragging){ return; }\n    if(x > 100){ this.commitSwipeDecision(true); return; }\n    if(x < -100){ this.commitSwipeDecision(false); return; }\n    this.setState({swipeDragX:0, swipeDragging:false});\n  };\n\n  // ---- rank ----\n  enterRank = () => {\n    const list = this.state.kept.length ? this.state.kept : this.getSelectedLabels();\n    this.setState({rankList: list, topCount: Math.max(3,Math.min(10,list.length))});\n  };\n  moveItem = (idx, dir) => {\n    const to = idx + dir;\n    const list = this.state.rankList.slice();\n    if(to<0 || to>=list.length) return;\n    [list[idx], list[to]] = [list[to], list[idx]];\n    this.setState({rankList: list});\n  };\n  setTopCount = (e) => { this.setState({topCount: parseInt(e.target.value,10)}); };\n\n  // ---- statement ----\n  setNote = (label, e) => {\n    this.setState({statementNotes: {...this.state.statementNotes, [label]: e.target.value}});\n  };\n  doPrint = () => { window.print(); };\n  // Opting in flips DND off on the GHL contact; GHL's own workflow sends the\n  // email, so the app never sends one itself.\n  onEmailOptInChange = (e) => {\n    const on = !!e.target.checked;\n    this.setState({emailOptIn: on, emailSent:false}, () => {\n      if(!(this.state.contact && this.state.contact.email)) return;\n      const payload = this.buildGhlPayload(this.state.guide ? 'completed' : 'values-statement');\n      Promise.resolve(this.postToGhl(payload)).then(ok => {\n        if(on) this.setState({emailSent: !!ok});\n      });\n    });\n  };\n  onGoToPerfectClient = () => { this.setState({screen:'intro'}); };\n  pcSetName = (idx, e) => {\n    const personas = (this.state.pcPersonas||[{name:'',answers:{},otherValues:{},otherActive:{}}]).slice();\n    personas[idx] = {...personas[idx], name: e.target.value};\n    this.setState({pcPersonas: personas});\n  };\n  pcSelect = (idx, qid, label) => {\n    const personas = (this.state.pcPersonas||[{name:'',answers:{},otherValues:{},otherActive:{}}]).slice();\n    const p = personas[idx];\n    personas[idx] = {...p, answers: {...p.answers, [qid]: label}, otherActive: {...p.otherActive, [qid]: false}};\n    this.setState({pcPersonas: personas});\n  };\n  pcSelectOther = (idx, qid) => {\n    const personas = (this.state.pcPersonas||[{name:'',answers:{},otherValues:{},otherActive:{}}]).slice();\n    const p = personas[idx];\n    personas[idx] = {...p, otherActive: {...p.otherActive, [qid]: true}, answers: {...p.answers, [qid]: p.otherValues[qid] || ''}};\n    this.setState({pcPersonas: personas});\n  };\n  pcOtherChange = (idx, qid, e) => {\n    const val = e.target.value;\n    const personas = (this.state.pcPersonas||[{name:'',answers:{},otherValues:{},otherActive:{}}]).slice();\n    const p = personas[idx];\n    personas[idx] = {...p, otherValues: {...p.otherValues, [qid]: val}, answers: {...p.answers, [qid]: val}};\n    this.setState({pcPersonas: personas});\n  };\n  pcAddSecond = () => {\n    if((this.state.pcPersonas||[]).length >= 2) return;\n    this.setState({pcPersonas: (this.state.pcPersonas||[{name:'',answers:{},otherValues:{},otherActive:{}}]).concat([{name:'', answers:{}, otherValues:{}, otherActive:{}}])});\n  };\n  pcRemoveSecond = () => { this.setState({pcPersonas: (this.state.pcPersonas||[]).slice(0,1)}); };\n  onContinueFromPc = () => { this.setState({screen:'wrapup'}); };\n\n  // ---- business details ----\n  onGoToBizDetails = () => { this.setState({screen:'bizdetails'}); };\n  setBizField = (key, e) => { this.setState({biz: {...this.state.biz, [key]: e.target.value}}); };\n  chooseReachType = (val) => { this.setState({biz: {...this.state.biz, reachType: val}}); };\n  setFaq = (idx, key, e) => {\n    const faqs = this.state.faqs.slice();\n    faqs[idx] = {...faqs[idx], [key]: e.target.value};\n    this.setState({faqs});\n  };\n  addFaq = () => { this.setState({faqs: this.state.faqs.concat([{q:'', a:''}])}); };\n  removeFaq = (idx) => { this.setState({faqs: this.state.faqs.filter((_,i)=>i!==idx)}); };\n  onContinueFromBizDetails = () => { this.onStartInterview(); };\n\n  // ---- brand voice interview ----\n  onStartInterview = () => {\n    if(this.state.interviewMessages.length===0){\n      this.setState({screen:'interview', interviewMessages:[{role:'bot', text: INTERVIEW_QUESTIONS[0].prompt}]});\n    } else {\n      this.setState({screen:'interview'});\n    }\n  };\n  onInterviewDraftChange = (e) => { this.setState({interviewDraft: e.target.value}); };\n  onInterviewKeyDown = (e) => { if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); this.sendInterviewAnswer(); } };\n  onToggleTypeInstead = () => { this.setState({showTypeInput: !this.state.showTypeInput}); };\n  onMicToggle = () => {\n    if(!this.recognition) return;\n    if(this.state.micListening){ this.recognition.stop(); this.setState({micListening:false}); }\n    else { this.setState({micListening:true}); try{ this.recognition.start(); }catch(e){} }\n  };\n  sendInterviewAnswer = () => {\n    const st = this.state;\n    const draft = st.interviewDraft.trim();\n    if(!draft) return;\n    const q = INTERVIEW_QUESTIONS[st.interviewIdx];\n    const messages = st.interviewMessages.concat([{role:'user', text: draft}]);\n    const answers = {...st.interviewAnswers, [q.id]: draft};\n    const nextIdx = st.interviewIdx + 1;\n    if(nextIdx < INTERVIEW_QUESTIONS.length){\n      const ackIndex = messages.length;\n      messages.push({role:'bot', text: INTERVIEW_QUESTIONS[nextIdx].prompt});\n      this.setState({interviewMessages: messages, interviewAnswers: answers, interviewIdx: nextIdx, interviewDraft:'', showTypeInput:false});\n      this.addAcknowledgment(q, draft, answers, ackIndex);\n    } else {\n      this.setState({interviewMessages: messages, interviewAnswers: answers, interviewIdx: nextIdx, interviewDraft:'', showTypeInput:false});\n      this.generateVisualOptions(answers);\n    }\n  };\n  addAcknowledgment = async (q, answer, answers, insertAt) => {\n    if(!this.aiAvailable()) return;\n    try{\n      const st = this.state;\n      const prompt = `You are interviewing ${st.contact && st.contact.name ? st.contact.name : 'a business owner'} about ${st.businessName || 'their business'} to build a brand guide. Their core values are ${st.rankList.slice(0, st.topCount).join(', ')}.\nYou just asked: \"${q.prompt}\"\nThey answered: \"${answer}\"\nReply with ONE short sentence (max 20 words) that shows you actually heard THIS answer — reflect back something specific they said, or connect it to one of their values. Warm and plain-spoken, no praise-words like \"amazing\" or \"love that\", no emoji, no questions. Return only the sentence.`;\n      let text = (await this.aiComplete({messages:[{role:'user', content: prompt}], max_tokens: 80})).trim();\n      // Models sometimes return unbalanced quotes; an ack is decorative, so strip\n      // all doubles rather than ship a fragment like `We fix it\" is ...`.\n      text = text.replace(/^[\"']+|[\"']+$/g, '').trim();\n      if((text.match(/\"/g) || []).length % 2 !== 0) text = text.replace(/\"/g, '').trim();\n      if(!text || text.length < 4) return;\n      this.setState(s => {\n        const msgs = s.interviewMessages.slice();\n        if(msgs[insertAt] && msgs[insertAt].role === 'bot' && !msgs[insertAt].ack){\n          msgs.splice(insertAt, 0, {role:'bot', text, ack:true});\n        }\n        return {interviewMessages: msgs};\n      });\n    }catch(e){}\n  };\n  generateVisualOptions = async (answers) => {\n    this.setState({generatingVisual:true, visualError:''});\n    const st = this.state;\n    const colorsAnswer = answers.colors || '';\n    const fontsAnswer = answers.fonts || '';\n    try{\n      const prompt = `You are a brand designer suggesting visual identity directions for a small business.\nBusiness name: \"${st.businessName || 'This business'}\"\nCore values: ${st.rankList.slice(0, st.topCount).join(', ')}\nBrand personality: ${answers.persona || ''}\nWhat they said about colors: \"${colorsAnswer}\"\nWhat they said about fonts/logo: \"${fontsAnswer}\"\n\nProduce ONLY valid JSON (no markdown) in this exact shape:\n{\n  \"palettes\": [\n    [{\"hex\":\"#RRGGBB\",\"name\":\"...\",\"role\":\"Primary\"}, {\"hex\":\"#RRGGBB\",\"name\":\"...\",\"role\":\"Acce
