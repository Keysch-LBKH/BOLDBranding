, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Archivo';\n  font-style: normal;\n  font-weight: 800;\n  font-stretch: 100%;\n  font-display: swap;\n  src: url(\"70507589-cd91-4b31-878a-6fc5e66b18d3\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #ec3013;\n  --color-accent-2: #e15b47;\n  --color-divider: color-mix(in srgb, #201e1d 40%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #fff2ef;\n  --color-accent-200: #ffe0d9;\n  --color-accent-300: #ffc4b8;\n  --color-accent-400: #ff9783;\n  --color-accent-500: #ff563c;\n  --color-accent-600: #dd2b0f;\n  --color-accent-700: #ae1800;\n  --color-accent-800: #7c1405;\n  --color-accent-900: #4d170e;\n\n  --color-accent-2-100: #fff2ef;\n  --color-accent-2-200: #ffe0da;\n  --color-accent-2-300: #ffc4b9;\n  --color-accent-2-400: #ff9784;\n  --color-accent-2-500: #ef6853;\n  --color-accent-2-600: #c94b39;\n  --color-accent-2-700: #9e3526;\n  --color-accent-2-800: #71261b;\n  --color-accent-2-900: #471d16;\n\n  --font-heading: \"Archivo\", system-ui, sans-serif;\n  --font-heading-weight: 800;\n  --font-body: \"Archivo\", system-ui, sans-serif;\n\n  --space-1: 4.0px;\n  --space-2: 8.0px;\n  --space-3: 12.0px;\n  --space-4: 16.0px;\n  --space-6: 24.0px;\n  --space-8: 32.0px;\n\n  --radius-sm: 0px;\n  --radius-md: 0px;\n  --radius-lg: 0px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.grayscale{filter:grayscale(1) contrast(1.08)}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 2px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); justify-content: flex-start; text-align: left; }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: 2px solid var(--color-divider);\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 2px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid var(--color-divider);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\/style>\n  <style>\n    /* The control layer (.btn/.input/.field/.card/.tag) is consumed from the\n       Modernist stylesheet, but every value it reads is aliased to the LBKH\n       tokens below — so the whole app paints in LBKH orange/Archivo and follows\n       LBKH's own light/dark flip. */\n    :root{\n      --color-bg: var(--lbkh-bg); --color-surface: var(--lbkh-surface); --color-text: var(--lbkh-text);\n      --color-divider: var(--lbkh-neutral-300);\n      --font-heading: var(--lbkh-font); --font-body: var(--lbkh-font);\n      --radius-sm: var(--lbkh-radius); --radius-md: var(--lbkh-radius); --radius-lg: var(--lbkh-radius);\n      --color-neutral-100: var(--lbkh-neutral-100); --color-neutral-200: var(--lbkh-neutral-200);\n      --color-neutral-300: var(--lbkh-neutral-300); --color-neutral-400: var(--lbkh-neutral-400);\n      --color-neutral-500: var(--lbkh-neutral-500); --color-neutral-600: var(--lbkh-neutral-600);\n      --color-neutral-700: var(--lbkh-neutral-700); --color-neutral-800: var(--lbkh-neutral-800);\n      --color-neutral-900: var(--lbkh-neutral-900);\n      --color-accent: var(--lbkh-accent-500); --color-accent-2: var(--lbkh-accent-500);\n      --color-accent-100: var(--lbkh-accent-100); --color-accent-200: var(--lbkh-accent-200);\n      --color-accent-300: var(--lbkh-accent-300); --color-accent-400: var(--lbkh-accent-400);\n      --color-accent-500: var(--lbkh-accent-500); --color-accent-600: var(--lbkh-accent-600);\n      --color-accent-700: var(--lbkh-accent-700); --color-accent-800: var(--lbkh-accent-800);\n      --color-accent-900: var(--lbkh-accent-900);\n      --color-accent-2-100: var(--lbkh-accent-100); --color-accent-2-200: var(--lbkh-accent-200);\n      --color-accent-2-300: var(--lbkh-accent-300); --color-accent-2-400: var(--lbkh-accent-400);\n      --color-accent-2-500: var(--lbkh-accent-500); --color-accent-2-600: var(--lbkh-accent-600);\n      --color-accent-2-700: var(--lbkh-accent-700); --color-accent-2-800: var(--lbkh-accent-800);\n      --color-accent-2-900: var(--lbkh-accent-900);\n    }\n    /* LBKH ships one accent ramp for both themes; on the dark ground the deep\n       steps fall under 3:1, so flip which end of the ramp counts as \"deep\". */\n    :root[data-theme=\"dark\"]{\n      --color-accent-700: var(--lbkh-accent-300); --color-accent-800: var(--lbkh-accent-200);\n      --color-accent-900: var(--lbkh-accent-100);\n      --color-accent-100: var(--lbkh-accent-900); --color-accent-200: var(--lbkh-accent-800);\n      --color-accent-300: var(--lbkh-accent-700);\n      --color-accent-2-700: var(--lbkh-accent-300); --color-accent-2-800: var(--lbkh-accent-200);\n      --color-accent-2-900: var(--lbkh-accent-100);\n      --color-accent-2-100: var(--lbkh-accent-900); --color-accent-2-200: var(--lbkh-accent-800);\n      --color-accent-2-300: var(--lbkh-accent-700);\n    }\n    a { color: var(--color-accent-700); }\n    a:hover { color: var(--color-accent); }\n    /* The logo art carries no fill of its own, so it renders as ink; invert it\n       on the dark ground rather than shipping a second file. */\n    :root[data-theme=\"dark\"] .lbkh-mark { filter: invert(1); }\n  <\/style>\n  <style>\n    body{margin:0;background:var(--color-neutral-200);}\n    input,textarea{font-family:var(--font-body);}\n    ::-webkit-scrollbar{display:none}\n    @keyframes om-spin{to{transform:rotate(360deg);}}\n    @keyframes narrowDemoSwing{0%,100%{transform:translateX(0) rotate(0deg);}25%{transform:translateX(22px) rotate(7deg);}50%{transform:translateX(0) rotate(0deg);}75%{transform:translateX(-22px) rotate(-7deg);}}\n    .narrow-demo-card{animation:narrowDemoSwing 3s ease-in-out infinite;}\n  <\/style>\n<\/helmet>\n\n<div style=\"min-height:100vh;background:var(--color-neutral-200);display:flex;justify-content:center;padding:24px 12px;box-sizing:border-box;\">\n<div style=\"width:100%;max-width:430px;background:var(--color-bg);min-height:844px;display:flex;flex-direction:column;border:2px solid var(--color-neutral-300);\">\n\n  <div style=\"padding:20px 20px 0;\">\n    <div style=\"display:flex;align-items:center;justify-content:space-between;\">\n      <div style=\"display:flex;align-items:center;\">\n        <img class=\"lbkh-mark\" src=\"a894f403-792c-4980-a6dc-a9f6215b3f12\" alt=\"LBKH Solutions\" style=\"height:40px;width:auto;display:block;\">\n      <\/div>\n      <div style=\"display:flex;align-items:center;gap:14px;\">\n        <button sc-camel-on-click=\"{{ onToggleTheme }}\" style=\"border:2px solid var(--color-text);background:none;font:600 10px var(--font-body);text-transform:uppercase;letter-spacing:0.04em;color:var(--color-text);cursor:pointer;padding:4px 8px;\">{{ themeLabel }}<\/button>\n        <button sc-camel-on-click=\"{{ resetAll }}\" style=\"border:none;background:none;font:600 11px var(--font-body);color:var(--color-neutral-700);cursor:pointer;padding:4px 0;\">Start Over<\/button>\n      <\/div>\n    <\/div>\n    <div style=\"margin-top:14px;font:600 10px/1 var(--font-body);letter-spacing:0.08em;text-transform:uppercase;color:var(--color-accent-700);\">{{ stepLabel }}<\/div>\n    <div style=\"margin-top:8px;height:2px;background:var(--color-neutral-300);width:100%;\">\n      <div style=\"height:2px;background:var(--color-accent);width:{{ progressPct }}%;\"><\/div>\n    <\/div>\n  <\/div>\n\n  <div id=\"guide-scroll\" style=\"flex:1;overflow-y:auto;padding:20px;box-sizing:border-box;\">\n\n    <sc-if value=\"{{ showAiWarning }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border:2px solid var(--color-accent);background:var(--color-accent-100);padding:12px 14px;margin-bottom:16px;\">\n        <div style=\"font:700 11px var(--font-body);text-transform:uppercase;letter-spacing:0.04em;color:var(--color-accent-700);margin-bottom:4px;\">Setup needed<\/div>\n        <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-accent-900);\">The AI-generated steps (values statement, brand voice, visual identity, guide) need an AI endpoint configured for this site. Everything else works normally.<\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showIntro }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:20px;padding-top:24px;\">\n        <div style=\"height:2px;background:var(--color-accent);width:56px;\"><\/div>\n        <div style=\"font:700 28px/1.1 var(--font-heading);color:var(--color-text);\">Confirm your details<\/div>\n        <div style=\"font:400 14px/1.5 var(--font-body);color:var(--color-neutral-700);\">Your values statement is done — you can print or download it any time from the previous screen. Check what we have and add your website and social so the Brand Guide matches your real presence.<\/div>\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:18px;display:flex;flex-direction:column;gap:14px;\">\n          <div class=\"field\">\n            <label>Your name<\/label>\n            <input class=\"input\" type=\"text\" placeholder=\"Jane Smith\" value=\"{{ contact.yourName }}\" sc-camel-on-change=\"{{ onContactYourNameChange }}\">\n          <\/div>\n          <div class=\"field\">\n            <label>Phone number<\/label>\n            <input class=\"input\" type=\"tel\" placeholder=\"(555) 123-4567\" value=\"{{ contact.phone }}\" sc-camel-on-change=\"{{ onContactPhoneChange }}\">\n          <\/div>\n          <div class=\"field\">\n            <label>Email<\/label>\n            <input class=\"input\" type=\"email\" placeholder=\"jane@business.com\" value=\"{{ contact.email }}\" sc-camel-on-change=\"{{ onContactEmailChange }}\">\n          <\/div>\n          <div class=\"field\">\n            <label>Business name<\/label>\n            <input class=\"input\" type=\"text\" placeholder=\"Smith &amp; Co.\" value=\"{{ contact.businessName }}\" sc-camel-on-change=\"{{ onContactBusinessNameChange }}\">\n          <\/div>\n          <div class=\"field\">\n            <label>Website<\/label>\n            <input class=\"input\" type=\"text\" placeholder=\"www.smithandco.com\" value=\"{{ contact.website }}\" sc-camel-on-change=\"{{ onContactWebsiteChange }}\">\n          <\/div>\n          <div class=\"field\">\n            <label>Main social (we'll follow)<\/label>\n            <input class=\"input\" type=\"text\" placeholder=\"@smithandco\" value=\"{{ contact.social }}\" sc-camel-on-change=\"{{ onContactSocialChange }}\">\n          <\/div>\n        <\/div>\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:400 11px/1.55 var(--font-body);color:var(--color-neutral-600);\">By continuing you agree to let LBKH Solutions email and text you about your Brand Guide and occasional related offers. Message and data rates may apply. Reply STOP to opt out at any time, or unsubscribe from any email. We don't sell your information.<\/div>\n        <\/div>\n        <button sc-camel-on-click=\"{{ onIntroNext }}\" class=\"btn btn-primary btn-block\" disabled=\"{{ !introComplete }}\" style=\"margin-top:8px;\">Continue<\/button>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showWelcome }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"display:flex;flex-direction:column;gap:24px;padding-top:24px;\">\n        <div style=\"height:2px;background:var(--color-accent);width:56px;\"><\/div>\n        <div style=\"font:700 34px/1.05 var(--font-heading);color:var(--color-text);\">Define your business values.<\/div>\n        <div style=\"font:400 15px/1.6 var(--font-body);color:var(--color-neutral-700);\">A guided workbook for reviewing your business's experience, brainstorming what matters, narrowing to what's essential, and leaving with a clear Values Statement you can share with your team.<\/div>\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:20px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">01<\/div><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Life Experience Review<\/div><\/div>\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">02<\/div><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Brainstorm<\/div><\/div>\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">03<\/div><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Narrow<\/div><\/div>\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">04<\/div><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Rank<\/div><\/div>\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">05<\/div><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Reflect<\/div><\/div>\n          <div style=\"display:flex;gap:12px;align-items:baseline;\"><div style=\"font:700 13px var(--font-heading);color:var(--color-accent-700);width:20px;\">06<\/div><div style=\"font:500 13px var(--font-body);color:var(--color-text);\">Values Statement<\/div><\/div>\n        <\/div>\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:18px;display:flex;flex-direction:column;gap:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);\">First, who are we working with?<\/div>\n          <div class=\"field\">\n            <label>Your name<\/label>\n            <input class=\"input\" type=\"text\" placeholder=\"Jane Smith\" value=\"{{ contact.yourName }}\" sc-camel-on-change=\"{{ onContactYourNameChange }}\">\n          <\/div>\n          <div class=\"field\">\n            <label>Email<\/label>\n            <input class=\"input\" type=\"email\" placeholder=\"jane@business.com\" value=\"{{ contact.email }}\" sc-camel-on-change=\"{{ onContactEmailChange }}\">\n          <\/div>\n          <div class=\"field\">\n            <label>Phone number<\/label>\n            <input class=\"input\" type=\"tel\" placeholder=\"(555) 123-4567\" value=\"{{ contact.phone }}\" sc-camel-on-change=\"{{ onContactPhoneChange }}\">\n          <\/div>\n          <div class=\"field\">\n            <label>Business name<\/label>\n            <input class=\"input\" type=\"text\" placeholder=\"Smith &amp; Co.\" value=\"{{ contact.businessName }}\" sc-camel-on-change=\"{{ onContactBusinessNameChange }}\">\n          <\/div>\n          <div style=\"font:400 11px/1.55 var(--font-body);color:var(--color-neutral-600);border-top:2px solid var(--color-neutral-300);padding-top:12px;\">We use this to save your progress and send your finished work. LBKH Solutions may email or text you about your Brand Guide and occasional related offers. Message and data rates may apply. Reply STOP to opt out at any time, or unsubscribe from any email. We don't sell your information.<\/div>\n        <\/div>\n        <button sc-camel-on-click=\"{{ onNext }}\" class=\"btn btn-primary btn-block\" disabled=\"{{ !welcomeComplete }}\" style=\"margin-top:8px;\">Get Started<\/button>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showLifeReview }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <sc-if value=\"{{ isLifeArea }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">How do you feel about each part?<\/div>\n          <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">One tap each. Go with your gut — first instinct is usually right.<\/div>\n          <sc-for list=\"{{ lifeAreaRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n            <div style=\"border-top:2px solid var(--color-neutral-300);padding:14px 0;\">\n              <div style=\"font:600 13px/1.3 var(--font-body);color:var(--color-text);margin-bottom:10px;\">{{ row.label }}<\/div>\n              <div class=\"seg\" style=\"display:grid;grid-template-columns:repeat(4,1fr);margin-bottom:8px;\">\n                <sc-for list=\"{{ row.options }}\" as=\"opt\" hint-placeholder-count=\"4\">\n                  <label class=\"seg-opt\" style=\"font-size:11px;padding:9px 4px;justify-content:center;\">\n                    <input type=\"radio\" name=\"{{ row.groupName }}\" checked=\"{{ opt.checked }}\" sc-camel-on-change=\"{{ opt.onSelect }}\">\n                    {{ opt.label }}\n                  <\/label>\n                <\/sc-for>\n              <\/div>\n              <input class=\"input\" type=\"text\" placeholder=\"Why? (optional)\" value=\"{{ row.note }}\" sc-camel-on-change=\"{{ row.onNoteChange }}\" style=\"width:100%;box-sizing:border-box;font-size:12px;\">\n            <\/div>\n          <\/sc-for>\n        <\/sc-if>\n        <sc-if value=\"{{ isLifeSynthesis }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">The work itself<\/div>\n          <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">A sentence each is plenty. Skip anything that doesn't apply.<\/div>\n          <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n            <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">What's your favorite part of running this business?<\/div>\n            <textarea class=\"input\" rows=\"3\" value=\"{{ themesNote }}\" sc-camel-on-change=\"{{ onThemesChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n          <\/div>\n          <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n            <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">What part would you hand off tomorrow if you could?<\/div>\n            <textarea class=\"input\" rows=\"3\" value=\"{{ dislikeNote }}\" sc-camel-on-change=\"{{ onDislikeChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n          <\/div>\n          <sc-for list=\"{{ workRows }}\" as=\"row\" hint-placeholder-count=\"5\">\n            <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n              <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:2px;\">{{ row.label }}<\/div>\n              <div style=\"font:400 11px/1.4 var(--font-body);color:var(--color-neutral-600);margin-bottom:6px;\">{{ row.hint }}<\/div>\n              <textarea class=\"input\" rows=\"3\" value=\"{{ row.value }}\" sc-camel-on-change=\"{{ row.onChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n            <\/div>\n          <\/sc-for>\n        <\/sc-if>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showBrainstorm }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">What matters most?<\/div>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Here are 50 values. Click on anything that vibes with your idea of your business. In the next step, we'll turn that into cards and swipe it down to 3–7.<\/div>\n        <div style=\"border-top:2px solid var(--color-neutral-300);border-bottom:2px solid var(--color-neutral-300);padding:14px 0;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:8px;\">Selected ({{ selectedCount }})<\/div>\n          <sc-if value=\"{{ hasSelection }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n              <sc-for list=\"{{ selectedChips }}\" as=\"chip\" hint-placeholder-count=\"4\">\n                <span sc-camel-on-click=\"{{ chip.onRemove }}\" class=\"tag tag-accent\" style=\"cursor:pointer;\">{{ chip.label }} ×<\/span>\n              <\/sc-for>\n            <\/div>\n          <\/sc-if>\n          <sc-if value=\"{{ noSelection }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:400 13px var(--font-body);color:var(--color-neutral-500);\">Nothing selected yet.<\/div>\n          <\/sc-if>\n        <\/div>\n        <div style=\"display:flex;gap:8px;\">\n          <input class=\"input\" type=\"text\" placeholder=\"Write your own value...\" value=\"{{ customDraft }}\" sc-camel-on-change=\"{{ onCustomChange }}\" sc-camel-on-key-down=\"{{ onCustomKeyDown }}\" style=\"flex:1;\">\n          <button sc-camel-on-click=\"{{ onCustomAdd }}\" class=\"btn btn-secondary\">Add<\/button>\n        <\/div>\n        <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-top:4px;\">Or pick from this list<\/div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n          <sc-for list=\"{{ curatedChips }}\" as=\"chip\" hint-placeholder-count=\"12\">\n            <span sc-camel-on-click=\"{{ chip.onToggle }}\" class=\"{{ chip.className }}\" style=\"cursor:pointer;\">{{ chip.label }}<\/span>\n          <\/sc-for>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showNarrow }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;height:100%;\">\n        <sc-if value=\"{{ showNarrowIntro }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:20px;align-items:center;text-align:center;padding-top:12px;\">\n            <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">The Values Round<\/div>\n            <div style=\"font:400 14px/1.6 var(--font-body);color:var(--color-neutral-700);max-width:280px;\">Here are great business values, you start with {{ deckSize }}. Your target is 3–7. If you vibe with it, swipe right. If not, swipe left.<\/div>\n            <div style=\"display:flex;align-items:center;gap:16px;width:100%;justify-content:center;\">\n              <div style=\"font:700 12px var(--font-heading);color:var(--color-neutral-600);width:52px;text-align:right;\">← Pass<\/div>\n              <div style=\"width:80px;display:flex;justify-content:center;\">\n                <div class=\"narrow-demo-card\" style=\"width:70px;height:70px;background:var(--color-bg);border:2px solid var(--color-text);\"><\/div>\n              <\/div>\n              <div style=\"font:700 12px var(--font-heading);color:var(--color-accent);width:52px;text-align:left;\">Vibe →<\/div>\n            <\/div>\n            <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);max-width:280px;\">Remember, the challenge is to get rid of them and get to the core of your business values. Everything you keep moves to the next round — rounds repeat until you're at 3–7. (You can add your own later if you don't see them.)<\/div>\n            <button sc-camel-on-click=\"{{ onStartNarrowRound }}\" class=\"btn btn-primary btn-block\">Start Swiping<\/button>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ narrowMainVisible }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Round {{ round }}<\/div>\n          <sc-if value=\"{{ swipeActive }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Swipe right if you vibe with it, left if you don't.<\/div>\n            <div>\n              <div style=\"display:flex;justify-content:space-between;font:600 11px var(--font-body);color:var(--color-neutral-500);margin-bottom:4px;\"><span>{{ keptCount }} kept so far<\/span><span>{{ roundPositionLabel }}<\/span><\/div>\n              <div style=\"height:2px;background:var(--color-neutral-300);\"><div style=\"height:2px;background:var(--color-accent);width:{{ roundProgressPct }}%;\"><\/div><\/div>\n            <\/div>\n            <div style=\"position:relative;width:100%;height:370px;margin:4px 0 4px;\">\n              <sc-for list=\"{{ stackCards }}\" as=\"card\" hint-placeholder-count=\"3\">\n                <div sc-camel-on-pointer-down=\"{{ card.onDown }}\" sc-camel-on-pointer-move=\"{{ card.onMove }}\" sc-camel-on-pointer-up=\"{{ card.onUp }}\" sc-camel-on-pointer-leave=\"{{ card.onUp }}\" style=\"position:absolute;inset:0;background:var(--color-bg);border:2px solid var(--color-text);display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;transform:{{ card.transform }};z-index:{{ card.z }};transition:{{ card.transition }};opacity:{{ card.opacity }};touch-action:none;user-select:none;\">\n                  <div style=\"font:700 28px/1.15 var(--font-heading);text-align:center;color:var(--color-text);\">{{ card.label }}<\/div>\n                  <sc-if value=\"{{ card.isFront }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:absolute;top:16px;left:16px;font:700 13px var(--font-heading);color:var(--color-accent);opacity:{{ card.keepOpacity }};border:2px solid var(--color-accent);padding:4px 10px;transform:rotate(-8deg);\">VIBE<\/div>\n                  <\/sc-if>\n                  <sc-if value=\"{{ card.isFront }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"position:absolute;top:16px;right:16px;font:700 13px var(--font-heading);color:var(--color-neutral-600);opacity:{{ card.discardOpacity }};border:2px solid var(--color-neutral-600);padding:4px 10px;transform:rotate(8deg);\">PASS<\/div>\n                  <\/sc-if>\n                <\/div>\n              <\/sc-for>\n            <\/div>\n            <div style=\"display:flex;gap:12px;\">\n              <button sc-camel-on-click=\"{{ onDiscard }}\" class=\"btn btn-secondary btn-block\">✕ Pass<\/button>\n              <button sc-camel-on-click=\"{{ onKeep }}\" class=\"btn btn-primary btn-block\">✓ Vibe<\/button>\n            <\/div>\n          <\/sc-if>\n          <sc-if value=\"{{ swipeRoundDone }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:400 14px/1.6 var(--font-body);color:var(--color-neutral-700);\">Down to {{ keptCount }} values. {{ passMessage }}<\/div>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px;\">\n              <sc-for list=\"{{ keptChipsDisplay }}\" as=\"chip\" hint-placeholder-count=\"6\">\n                <span class=\"tag tag-accent\">{{ chip.label }}<\/span>\n              <\/sc-for>\n            <\/div>\n          <\/sc-if>\n        <\/sc-if>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showRank }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Rank your values<\/div>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Use the arrows to reorder, most important first. The line marks your final cut.<\/div>\n        <div style=\"display:flex;align-items:center;gap:10px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);white-space:nowrap;\">Keep top {{ topCount }}<\/div>\n          <input type=\"range\" min=\"3\" max=\"10\" value=\"{{ topCount }}\" sc-camel-on-change=\"{{ onTopCountChange }}\" style=\"flex:1;\">\n        <\/div>\n        <sc-for list=\"{{ rankItems }}\" as=\"item\" hint-placeholder-count=\"8\">\n          <div style=\"display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:{{ item.borderStyle }};opacity:{{ item.opacity }};background:{{ item.bg }};\">\n            <div style=\"font:700 16px var(--font-heading);color:{{ item.numColor }};width:24px;\">{{ item.num }}<\/div>\n            <div style=\"font:600 14px var(--font-body);color:var(--color-text);flex:1;\">{{ item.label }}<\/div>\n            <div style=\"display:flex;flex-direction:column;gap:2px;\">\n              <button sc-camel-on-click=\"{{ item.onUp }}\" class=\"btn btn-secondary btn-icon\" disabled=\"{{ item.isFirst }}\" style=\"width:32px;height:26px;padding:0;\">↑<\/button>\n              <button sc-camel-on-click=\"{{ item.onDown }}\" class=\"btn btn-secondary btn-icon\" disabled=\"{{ item.isLast }}\" style=\"width:32px;height:26px;padding:0;\">↓<\/button>\n            <\/div>\n          <\/div>\n        <\/sc-for>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showReflection }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:18px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Review &amp; wrap-up<\/div>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">A few final questions to turn this into action.<\/div>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">1. What did you learn about yourself or your business while doing this exercise?<\/div>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ reflLearned }}\" sc-camel-on-change=\"{{ onReflLearned }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">2. Did anything surprise you?<\/div>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ reflSurprises }}\" sc-camel-on-change=\"{{ onReflSurprises }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:8px;\">3. What could you...<\/div>\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <input class=\"input\" type=\"text\" placeholder=\"Stop doing\" value=\"{{ reflStop }}\" sc-camel-on-change=\"{{ onReflStop }}\">\n            <input class=\"input\" type=\"text\" placeholder=\"Do less of\" value=\"{{ reflLess }}\" sc-camel-on-change=\"{{ onReflLess }}\">\n            <input class=\"input\" type=\"text\" placeholder=\"Do more of\" value=\"{{ reflMore }}\" sc-camel-on-change=\"{{ onReflMore }}\">\n            <input class=\"input\" type=\"text\" placeholder=\"Continue doing\" value=\"{{ reflContinue }}\" sc-camel-on-change=\"{{ onReflContinue }}\">\n            <input class=\"input\" type=\"text\" placeholder=\"Start doing\" value=\"{{ reflStart }}\" sc-camel-on-change=\"{{ onReflStart }}\">\n          <\/div>\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">4. What is essential for this business — the thing it can never compromise on?<\/div>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ reflEssential }}\" sc-camel-on-change=\"{{ onReflEssential }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">5. What must this business avoid — the thing that would break trust or go against its values?<\/div>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ reflAvoid }}\" sc-camel-on-change=\"{{ onReflAvoid }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">6. In 3 years, fully aligned with these values, what does success look like?<\/div>\n          <textarea class=\"input\" rows=\"3\" value=\"{{ reflThreeYear }}\" sc-camel-on-change=\"{{ onReflThreeYear }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n        <\/div>\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">7. Make a promise to yourself: what's one action you can take based on what you learned about yourself and your business, and when are you going to do it by?<\/div>\n          <div style=\"display:flex;gap:8px;\">\n            <input class=\"input\" type=\"text\" placeholder=\"Action\" value=\"{{ reflAction }}\" sc-camel-on-change=\"{{ onReflAction }}\" style=\"flex:2;\">\n            <input class=\"input\" type=\"text\" placeholder=\"By when\" value=\"{{ reflByWhen }}\" sc-camel-on-change=\"{{ onReflByWhen }}\" style=\"flex:1;\">\n          <\/div>\n        <\/div>\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:2px;\">Last thing — what's your business called?<\/div>\n          <div style=\"font:400 11px/1.4 var(--font-body);color:var(--color-neutral-600);margin-bottom:6px;\">We'll name it in your statement.<\/div>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Loggers Lifestyle\" value=\"{{ businessName }}\" sc-camel-on-change=\"{{ onBusinessNameChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showStatement }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\" id=\"statement-capture\">\n        <div style=\"height:2px;background:var(--color-accent);width:56px;\"><\/div>\n        <input class=\"input\" type=\"text\" placeholder=\"Your business name\" value=\"{{ businessName }}\" sc-camel-on-change=\"{{ onBusinessNameChange }}\" style=\"font:700 20px var(--font-heading);border:none;border-bottom:2px solid var(--color-neutral-300);padding:4px 0;background:none;\">\n        <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);\">Business Values Statement<\/div>\n        <div style=\"border-top:2px solid var(--color-text);\"><\/div>\n\n        <sc-if value=\"{{ isGeneratingStatement }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0;text-align:center;\">\n            <div style=\"width:32px;height:32px;border:2px solid var(--color-neutral-300);border-top:2px solid var(--color-accent);border-radius:50%;animation:om-spin 0.9s linear infinite;\"><\/div>\n            <div style=\"font:400 13px var(--font-body);color:var(--color-neutral-600);\">Writing your mission statement and value descriptions.<\/div>\n            <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-500);\">This takes about a minute — we're writing it from your answers, not filling a template.<\/div>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ hasGenerateError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:400 12px var(--font-body);color:var(--color-accent-700);\">{{ generateError }}<\/div>\n          <button sc-camel-on-click=\"{{ onGenerateStatement }}\" class=\"btn btn-secondary\">Try Again<\/button>\n        <\/sc-if>\n        <sc-if value=\"{{ hasMissionStatement }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:400 15px/1.65 var(--font-body);color:var(--color-text);\">{{ missionStatement }}<\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ needsGenerateButton }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ onGenerateStatement }}\" class=\"btn btn-secondary\">Write My Statement<\/button>\n        <\/sc-if>\n\n        <sc-for list=\"{{ statementValues }}\" as=\"v\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex;gap:12px;padding:12px 0;border-bottom:2px solid var(--color-neutral-300);\">\n            <div style=\"font:700 18px var(--font-heading);color:var(--color-accent);width:24px;\">{{ v.num }}<\/div>\n            <div style=\"flex:1;\">\n              <div style=\"font:700 15px var(--font-heading);color:var(--color-text);\">{{ v.label }}<\/div>\n              <div style=\"font:400 13px/1.55 var(--font-body);color:var(--color-neutral-700);margin-top:4px;\">{{ v.note }}<\/div>\n            <\/div>\n          <\/div>\n        <\/sc-for>\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-700);\">What's essential<\/div>\n          <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-text);\">{{ reflEssentialDisplay }}<\/div>\n        <\/div>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-neutral-700);\">What to avoid<\/div>\n          <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-text);\">{{ reflAvoidDisplay }}<\/div>\n        <\/div>\n        <div style=\"background:var(--color-accent);padding:16px;display:flex;flex-direction:column;gap:4px;\">\n          <div style=\"font:600 10px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:#fff;opacity:0.85;\">My promise to myself<\/div>\n          <div style=\"font:700 15px var(--font-heading);color:#fff;\">{{ reflActionDisplay }}<\/div>\n          <div style=\"font:400 12px var(--font-body);color:#fff;opacity:0.85;\">by {{ reflByWhenDisplay }}<\/div>\n        <\/div>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:16px;display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);\">Save this statement<\/div>\n          <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-600);\">Take a screenshot to keep it, or check the box below and we'll email you a copy.<\/div>\n          <label style=\"display:flex;align-items:flex-start;gap:10px;border:2px solid var(--color-neutral-300);padding:12px;cursor:pointer;\">\n            <input type=\"checkbox\" checked=\"{{ emailOptIn }}\" sc-camel-on-change=\"{{ onEmailOptInChange }}\" style=\"width:18px;height:18px;margin:1px 0 0;accent-color:var(--color-accent-500);flex:0 0 auto;\">\n            <span style=\"font:600 13px/1.4 var(--font-body);color:var(--color-text);\">Email me a copy of my values statement<\/span>\n          <\/label>\n          <sc-if value=\"{{ emailSent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:600 13px var(--font-body);color:var(--color-accent-700);\">Got it — check your inbox in a few minutes.<\/div>\n          <\/sc-if>\n          <div style=\"font:400 11px/1.55 var(--font-body);color:var(--color-neutral-600);border-top:2px solid var(--color-neutral-300);padding-top:12px;\">Checking that box opts you in to emails and texts from LBKH Solutions about your values work and occasional related offers. Message and data rates may apply. Reply STOP to opt out at any time, or unsubscribe from any email. We don't sell your information.<\/div>\n        <\/div>\n\n        <button sc-camel-on-click=\"{{ onGoToPerfectClient }}\" class=\"btn btn-primary btn-block\">Keep Going: Build My Brand Guide<\/button>\n        <button sc-camel-on-click=\"{{ onPrint }}\" class=\"btn btn-secondary btn-block\">Print / Export<\/button>\n        <button sc-camel-on-click=\"{{ resetAll }}\" class=\"btn btn-ghost btn-block\">Start Over<\/button>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showPerfectClient }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Define your perfect client<\/div>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Pick the option that fits best, or write your own.<\/div>\n        <sc-for list=\"{{ pcPersonaBlocks }}\" as=\"persona\" hint-placeholder-count=\"1\">\n          <div style=\"border-top:2px solid var(--color-text);padding-top:14px;\">\n            <div style=\"font:700 13px var(--font-heading);letter-spacing:0.04em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:10px;\">{{ persona.heading }}<\/div>\n            <div style=\"margin-bottom:14px;\">\n              <div style=\"font:600 13px var(--font-body);color:var(--color-text);margin-bottom:10px;\">Give them a name<\/div>\n              <input class=\"input\" type=\"text\" placeholder=\"e.g. Sarah\" value=\"{{ persona.name }}\" sc-camel-on-change=\"{{ persona.onNameChange }}\" style=\"width:100%;box-sizing:border-box;\">\n            <\/div>\n            <sc-for list=\"{{ persona.questions }}\" as=\"q\" hint-placeholder-count=\"7\">\n              <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;margin-bottom:14px;\">\n                <div style=\"font:600 13px var(--font-body);color:var(--color-text);margin-bottom:10px;\">{{ q.text }}<\/div>\n                <div style=\"display:flex;flex-direction:column;gap:8px;\">\n                  <sc-for list=\"{{ q.options }}\" as=\"opt\" hint-placeholder-count=\"3\">\n                    <div sc-camel-on-click=\"{{ opt.onSelect }}\" class=\"{{ opt.className }}\" style=\"padding:10px 12px;font:400 13px var(--font-body);cursor:pointer;\">{{ opt.label }}<\/div>\n                  <\/sc-for>\n                  <div sc-camel-on-click=\"{{ q.onSelectOther }}\" class=\"{{ q.otherClassName }}\" style=\"padding:10px 12px;font:400 13px var(--font-body);cursor:pointer;\">Other<\/div>\n                  <sc-if value=\"{{ q.showOtherInput }}\" hint-placeholder-val=\"{{ false }}\">\n                    <input class=\"input\" type=\"text\" placeholder=\"Write your own...\" value=\"{{ q.otherValue }}\" sc-camel-on-change=\"{{ q.onOtherChange }}\" style=\"width:100%;box-sizing:border-box;\">\n                  <\/sc-if>\n                <\/div>\n              <\/div>\n            <\/sc-for>\n            <sc-if value=\"{{ persona.showRemove }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ onRemoveSecondPersona }}\" class=\"btn btn-ghost\">Remove this dream client<\/button>\n            <\/sc-if>\n          <\/div>\n        <\/sc-for>\n        <sc-if value=\"{{ showAddSecondPersona }}\" hint-placeholder-val=\"{{ false }}\">\n          <button sc-camel-on-click=\"{{ onAddSecondPersona }}\" class=\"btn btn-secondary btn-block\">+ Add a second dream client (different niche)<\/button>\n        <\/sc-if>\n        <sc-if value=\"{{ pcShowMissingNote }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-700);border-top:2px solid var(--color-neutral-300);padding-top:10px;\">{{ pcMissingNote }}<\/div>\n        <\/sc-if>\n        <div style=\"display:flex;gap:10px;padding-top:4px;\">\n          <button sc-camel-on-click=\"{{ onBackFromPc }}\" class=\"btn btn-secondary\">Back<\/button>\n          <button sc-camel-on-click=\"{{ onContinueFromPc }}\" class=\"btn btn-primary btn-block\" disabled=\"{{ pcContinueDisabled }}\">Continue<\/button>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showWrapup }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"height:2px;background:var(--color-accent);width:56px;\"><\/div>\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">You're all set for now<\/div>\n        <div style=\"font:400 14px/1.6 var(--font-body);color:var(--color-neutral-700);\">You've defined your business values and your perfect client. Next: the granular details your team or AI needs to answer questions, then a guided brand voice interview.<\/div>\n        <button sc-camel-on-click=\"{{ onGoToBizDetails }}\" class=\"btn btn-primary btn-block\">Add Business Details<\/button>\n        <div style=\"display:flex;gap:10px;\">\n          <button sc-camel-on-click=\"{{ onBackFromPc }}\" class=\"btn btn-secondary\">Back<\/button>\n          <button sc-camel-on-click=\"{{ resetAll }}\" class=\"btn btn-ghost btn-block\">Start Over<\/button>\n        <\/div>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showBizDetails }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Business details<\/div>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">The granular stuff — hours, areas served, policies, FAQs. This is what lets your team or an AI answer real questions accurately.<\/div>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Tagline<\/div>\n          <input class=\"input\" type=\"text\" placeholder=\"A short line describing what you do\" value=\"{{ biz.tagline }}\" sc-camel-on-change=\"{{ onBizTaglineChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">What do you do, in plain terms?<\/div>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ biz.whatYouDo }}\" sc-camel-on-change=\"{{ onBizWhatYouDoChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n        <\/div>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Hours of operation<\/div>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Mon–Fri 9am–5pm\" value=\"{{ biz.hoursText }}\" sc-camel-on-change=\"{{ onBizHoursTextChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Days off / holidays / blackout dates<\/div>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Weekends, major holidays\" value=\"{{ biz.daysOff }}\" sc-camel-on-change=\"{{ onBizDaysOffChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\/div>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Where are you located?<\/div>\n          <input class=\"input\" type=\"text\" placeholder=\"City, region, or address\" value=\"{{ biz.location }}\" sc-camel-on-change=\"{{ onBizLocationChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Areas served<\/div>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Greater Boston, or nationwide\" value=\"{{ biz.areasServed }}\" sc-camel-on-change=\"{{ onBizAreasServedChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:10px;\">Do you work in-person, remote, or both?<\/div>\n          <div style=\"display:flex;flex-direction:column;gap:8px;\">\n            <sc-for list=\"{{ reachOptions }}\" as=\"opt\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ opt.onSelect }}\" class=\"{{ opt.className }}\" style=\"padding:10px 12px;font:400 13px var(--font-body);cursor:pointer;\">{{ opt.label }}<\/div>\n            <\/sc-for>\n            <div sc-camel-on-click=\"{{ onSelectReachOther }}\" class=\"{{ reachOtherClassName }}\" style=\"padding:10px 12px;font:400 13px var(--font-body);cursor:pointer;\">Other<\/div>\n            <sc-if value=\"{{ reachOtherActive }}\" hint-placeholder-val=\"{{ false }}\">\n              <input class=\"input\" type=\"text\" placeholder=\"Describe it...\" value=\"{{ biz.reachOther }}\" sc-camel-on-change=\"{{ onReachOtherChange }}\" style=\"width:100%;box-sizing:border-box;\">\n            <\/sc-if>\n          <\/div>\n        <\/div>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-600);\">Using the phone, email and website you already gave us: {{ contactSummaryLine }}<\/div>\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Booking / scheduling link<\/div>\n          <input class=\"input\" type=\"text\" value=\"{{ biz.bookingLink }}\" sc-camel-on-change=\"{{ onBizBookingLinkChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\/div>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Payment methods accepted<\/div>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Card, cash, invoice, Venmo\" value=\"{{ biz.paymentMethods }}\" sc-camel-on-change=\"{{ onBizPaymentMethodsChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Pricing model<\/div>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Hourly, flat-fee, subscription\" value=\"{{ biz.pricingModel }}\" sc-camel-on-change=\"{{ onBizPricingModelChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Price range<\/div>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. $150–$400 per project\" value=\"{{ biz.priceRange }}\" sc-camel-on-change=\"{{ onBizPriceRangeChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Cancellation / refund policy<\/div>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ biz.cancellationPolicy }}\" sc-camel-on-change=\"{{ onBizCancellationPolicyChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Guarantee / warranty<\/div>\n          <textarea class=\"input\" rows=\"2\" value=\"{{ biz.guarantee }}\" sc-camel-on-change=\"{{ onBizGuaranteeChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Team size<\/div>\n          <input class=\"input\" type=\"text\" placeholder=\"e.g. Just me, or 12 employees\" value=\"{{ biz.teamSize }}\" sc-camel-on-change=\"{{ onBizTeamSizeChange }}\" style=\"width:100%;box-sizing:border-box;\">\n        <\/div>\n        <div>\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:6px;\">Anything else we should know?<\/div>\n          <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-600);margin-bottom:6px;\">Deposit requirements, artwork/proof policies, rescheduling rules, licensing, insurance, anything else that comes up but doesn't fit above.<\/div>\n          <textarea class=\"input\" rows=\"3\" value=\"{{ biz.otherPolicies }}\" sc-camel-on-change=\"{{ onBizOtherPoliciesChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n        <\/div>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);margin-bottom:10px;\">Frequently asked questions<\/div>\n          <sc-for list=\"{{ faqBlocks }}\" as=\"f\" hint-placeholder-count=\"1\">\n            <div style=\"margin-bottom:12px;padding-bottom:12px;border-bottom:2px solid var(--color-neutral-300);\">\n              <input class=\"input\" type=\"text\" placeholder=\"Question\" value=\"{{ f.q }}\" sc-camel-on-change=\"{{ f.onQChange }}\" style=\"width:100%;box-sizing:border-box;margin-bottom:6px;\">\n              <textarea class=\"input\" rows=\"2\" placeholder=\"Answer\" value=\"{{ f.a }}\" sc-camel-on-change=\"{{ f.onAChange }}\" style=\"width:100%;box-sizing:border-box;resize:vertical;\"><\/textarea>\n              <sc-if value=\"{{ f.showRemove }}\" hint-placeholder-val=\"{{ false }}\">\n                <button sc-camel-on-click=\"{{ f.onRemove }}\" class=\"btn btn-ghost\" style=\"margin-top:6px;\">Remove<\/button>\n              <\/sc-if>\n            <\/div>\n          <\/sc-for>\n          <button sc-camel-on-click=\"{{ onAddFaq }}\" class=\"btn btn-secondary btn-block\">+ Add another FAQ<\/button>\n        <\/div>\n\n        <button sc-camel-on-click=\"{{ onContinueFromBizDetails }}\" class=\"btn btn-primary btn-block\">Continue to Brand Voice Interview<\/button>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showInterview }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;height:100%;min-height:520px;\">\n        <div style=\"font:700 20px/1.2 var(--font-heading);color:var(--color-text);margin-bottom:4px;\">Brand Voice Interview<\/div>\n        <div style=\"font:400 12px var(--font-body);color:var(--color-neutral-600);margin-bottom:14px;\">Question {{ chatDisplayIndex }} of {{ chatTotal }}<\/div>\n        <div style=\"flex:1;display:flex;flex-direction:column;gap:12px;\">\n          <sc-for list=\"{{ chatMessages }}\" as=\"msg\" hint-placeholder-count=\"2\">\n            <div style=\"align-self:{{ msg.align }};max-width:85%;background:{{ msg.bg }};color:{{ msg.color }};padding:10px 14px;font:400 13px/1.5 var(--font-body);\">{{ msg.text }}<\/div>\n          <\/sc-for>\n        <\/div>\n        <sc-if value=\"{{ hasGuideError }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top:2px solid var(--color-neutral-300);margin-top:14px;padding-top:16px;display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-accent-700);\">{{ guideError }}<\/div>\n            <button sc-camel-on-click=\"{{ onRetryGuide }}\" class=\"btn btn-primary btn-block\">Try again<\/button>\n            <button sc-camel-on-click=\"{{ onSkipGuideAi }}\" class=\"btn btn-secondary btn-block\">Build my guide from my answers instead<\/button>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ isGeneratingGuide }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 0;text-align:center;\">\n            <div style=\"width:32px;height:32px;border:2px solid var(--color-neutral-300);border-top:2px solid var(--color-accent);border-radius:50%;animation:om-spin 0.9s linear infinite;\"><\/div>\n            <div style=\"font:400 13px var(--font-body);color:var(--color-neutral-600);\">Writing your brand guide from everything you've shared.<\/div>\n            <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-500);\">This takes about a minute — it's written from your answers, not template-filled.<\/div>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ isGeneratingVisual }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px 0;text-align:center;\">\n            <div style=\"width:32px;height:32px;border:2px solid var(--color-neutral-300);border-top:2px solid var(--color-accent);border-radius:50%;animation:om-spin 0.9s linear infinite;\"><\/div>\n            <div style=\"font:400 13px var(--font-body);color:var(--color-neutral-600);\">Suggesting palettes and font pairings.<\/div>\n            <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-500);\">About a minute. Grounded in how you described your brand.<\/div>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ interviewStalled }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"border-top:2px solid var(--color-neutral-300);margin-top:14px;padding-top:16px;display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"font:700 16px/1.2 var(--font-heading);color:var(--color-text);\">That's everything — 14 of 14.<\/div>\n            <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Keep going to pick fonts and colors, then build your Brand Guide.<\/div>\n            <sc-if value=\"{{ hasVisualError }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-accent-700);border-top:2px solid var(--color-neutral-300);padding-top:10px;\">{{ visualError }}<\/div>\n            <\/sc-if>\n            <button sc-camel-on-click=\"{{ onRetryVisual }}\" class=\"btn btn-primary btn-block\">Suggest fonts &amp; colors<\/button>\n            <button sc-camel-on-click=\"{{ onSkipVisualAi }}\" class=\"btn btn-secondary btn-block\">Choose from standard options instead<\/button>\n            <button sc-camel-on-click=\"{{ onSkipGuideAi }}\" class=\"btn btn-ghost btn-block\">Skip to my Brand Guide<\/button>\n          <\/div>\n        <\/sc-if>\n        <sc-if value=\"{{ interviewInProgress }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"border-top:2px solid var(--color-neutral-300);margin-top:14px;padding-top:16px;display:flex;flex-direction:column;align-items:center;gap:10px;\">\n            <sc-if value=\"{{ hasMic }}\" hint-placeholder-val=\"{{ false }}\">\n              <button sc-camel-on-click=\"{{ onMicToggle }}\" class=\"btn btn-icon\" style=\"width:64px;height:64px;border-radius:50%;{{ micButtonStyle }}\">{{ micIcon }}<\/button>\n              <div style=\"font:600 12px var(--font-body);color:var(--color-neutral-600);\">{{ micStatusText }}<\/div>\n            <\/sc-if>\n            <sc-if value=\"{{ chatDraftHasText }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"width:100%;background:var(--color-neutral-200);padding:10px 12px;font:400 13px/1.5 var(--font-body);color:var(--color-text);\">{{ chatDraft }}<\/div>\n            <\/sc-if>\n            <div style=\"display:flex;gap:8px;width:100%;\">\n              <button sc-camel-on-click=\"{{ onToggleTypeInstead }}\" class=\"btn btn-secondary btn-block\">{{ typeToggleLabel }}<\/button>\n              <button sc-camel-on-click=\"{{ onSendAnswer }}\" class=\"btn btn-primary btn-block\" disabled=\"{{ sendDisabled }}\">Send<\/button>\n            <\/div>\n            <sc-if value=\"{{ showTypeInput }}\" hint-placeholder-val=\"{{ false }}\">\n              <textarea class=\"input\" rows=\"2\" placeholder=\"Type your answer...\" value=\"{{ chatDraft }}\" sc-camel-on-change=\"{{ onChatDraftChange }}\" sc-camel-on-key-down=\"{{ onChatKeyDown }}\" style=\"width:100%;box-sizing:border-box;resize:none;\"><\/textarea>\n            <\/sc-if>\n          <\/div>\n        <\/sc-if>\n      <\/div>\n    <\/sc-if>\n\n    <sc-if value=\"{{ showVisual }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:16px;\">\n        <div style=\"font:700 22px/1.2 var(--font-heading);color:var(--color-text);\">Fonts, colors &amp; logo<\/div>\n        <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-neutral-700);\">Pick the direction that fits, or keep exploring — you can regenerate the logo idea below.<\/div>\n\n        <sc-if value=\"{{ isGeneratingVisual }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;flex-direction:column;align-items:center;gap:12px;padding:30px 0;text-align:center;\">\n            <div style=\"width:32px;height:32px;border:2px solid var(--color-neutral-300);border-top:2px solid var(--color-accent);border-radius:50%;animation:om-spin 0.9s linear infinite;\"><\/div>\n            <div style=\"font:400 13px var(--font-body);color:var(--color-neutral-600);\">Suggesting palettes and font pairings.<\/div>\n            <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-500);\">About a minute. Grounded in how you described your brand.<\/  11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px;\">Visual Identity (suggested)<\/div>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;\">\n            <sc-for list=\"{{ guideColors }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"width:64px;\">\n                <div style=\"width:64px;height:64px;background:{{ c.hex }};border:2px solid var(--color-text);\"><\/div>\n                <div style=\"font:600 10px var(--font-body);color:var(--color-text);margin-top:4px;\">{{ c.name }}<\/div>\n                <div style=\"font:400 10px var(--font-body);color:var(--color-neutral-600);\">{{ c.hex }}<\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <div style=\"font:400 13px/1.6 var(--font-body);color:var(--color-text);\"><b>{{ guide.visual.headingFont }}<\/b> + {{ guide.visual.bodyFont }}<\/div>\n          <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-700);margin-bottom:10px;\">{{ guide.visual.fontRationale }}<\/div>\n          <div style=\"font:600 11px var(--font-body);color:var(--color-neutral-600);margin-bottom:4px;\">Logo concept<\/div>\n          <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-text);\">{{ guide.visual.logoConcept }}<\/div>\n        <\/div>\n        <\/sc-if>\n\n        <div id=\"sec-dodont\" style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px;\">Do's &amp; Don'ts<\/div>\n          <sc-for list=\"{{ guideDoDont }}\" as=\"item\" hint-placeholder-count=\"3\">\n            <div style=\"padding:8px 0;border-bottom:2px solid var(--color-neutral-300);\">\n              <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-accent-700);\">✓ {{ item.do }}<\/div>\n              <di d Brand Guide (.md)<\/button>\n        <button sc-camel-on-click=\"{{ onExportJson }}\" class=\"btn btn-secondary btn-block\">Download JSON (for agent/staff training)<\/button>\n        <button sc-camel-on-click=\"{{ resetAll }}\" class=\"btn btn-ghost btn-block\">Start Over<\/button>\n      <\/div>\n    <\/sc-if>\n\n  <\/div>\n\n  <sc-if value=\"{{ showFooter }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:14px 20px 20px;border-top:2px solid var(--color-neutral-300);display:flex;gap:10px;\">\n      <sc-if value=\"{{ showBackBtn }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ onBack }}\" class=\"btn btn-secondary\">Back<\/button>\n      <\/sc-if>\n      <button sc-camel-on-click=\"{{ onNext }}\" class=\"btn btn-primary btn-block\" disabled=\"{{ nextDisabled }}\">{{ nextLabel }}<\/button>\n    <\/div>\n  <\/sc-if>\n\n  <sc-if value=\"{{ showSavedNote }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:10px 20px 0;display:flex;align-items:center;justify-content:center;gap:7px;\">\n      <div style=\"width:6px;height:6px;background:var(--color-accent);flex:none;\"><\/div>\n      <div style=\"font:500 11px/1.4 var(--font-body);color:var(--color-neutral-600);\">Progress saved — you can close this and come back.<\/div>\n    <\/div>\n  <\/sc-if>\n\n  <div style=\"padding:14px 20px;border-top:2px solid var(--color-neutral-300);display:flex;align-items:center;justify-content:center;gap:6px;\">\n    <a href=\"https://lbkh.solutions\" target=\"_blank\" rel=\"noopener\" style=\"font:600 11px var(--font-body);color:var(--color-neutral-700);text-decoration:none;\">LBKH Solutions. Already working for you.<\/a>\n  <\/div>\n\n<\/div>\n<\/div>\n\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CURATED = [\n  ['Accountability','Owning outcomes, good or bad.'],\n  ['Achievement','Setting and hitting real goals.'],\n  ['Adaptability','Adjusting quickly as conditions change.'],\n  ['Adventure','Seeking out new challenges and experiences.'],\n  ['Altruism','Putting others\\' good ahead of self-interest.'],\n  ['Ambition','Pushing for bigger goals.'],\n  ['Authenticity','Being genuinely yourself, not a performance.'],\n  ['Balance','Keeping work and life in proportion.'],\n  ['Beauty','Caring about craft, form and aesthetics.'],\n  ['Being the best','Aiming to lead the field.'],\n  ['Belonging','Making sure people feel they fit in.'],\n  ['Career','Investing in long-term professional growth.'],\n  ['Caring','Genuinely looking out for others.'],\n  ['Collaboration','Working together across teams.'],\n  ['Commitment','Following through on what you start.'],\n  ['Community','Investing in the people around the business.'],\n  ['Compassion','Responding to others\\' struggles with empathy.'],\n  ['Competence','Being genuinely skilled at the work.'],\n  ['Confidence','Acting with conviction in your ability.'],\n  ['Connection','Building real relationships, not just transactions.'],\n  ['Contentment','Finding satisfaction in what you have.'],\n  ['Contribution','Adding something of real value.'],\n  ['Cooperation','Choosing to work with, not against.'],\n  ['Courage','Doing the hard right thing.'],\n  ['Creativity','Generating original ideas and solutions.'],\n  ['Curiosity','Staying genuinely interested in how and why.'],\n  ['Dignity','Treating everyone as worthy of respect.'],\n  ['Diversity','Valuing different backgrounds and perspectives.'],\n  ['Environment','Protecting the natural world you operate in.'],\n  ['Efficiency','Getting more from less.'],\n  ['Equality','Giving everyone the same standing and chance.'],\n  ['Ethics','Doing what\\'s right, not just what\\'s legal.'],\n  ['Excellence','Refusing to settle for good enough.'],\n  ['Fairness','Treating people equitably.'],\n  ['Faith','Trusting in something larger than yourself.'],\n  ['Family','Honoring the people closest to you.'],\n  ['Financial stability','Building a business that can weather hard times.'],\n  ['Forgiveness','Letting go of grudges and mistakes.'],\n  ['Freedom','Preserving room to choose and act.'],\n  ['Friendship','Valuing warm, loyal relationships.'],\n  ['Fun','Making the work genuinely enjoyable.'],\n  ['Future generations','Building with tomorrow in mind, not just today.'],\n  ['Generosity','Giving freely of time, money or effort.'],\n  ['Giving back','Returning value to the community you draw from.'],\n  ['Grace','Extending patience and goodwill, especially when hard.'],\n  ['Gratitude','Noticing and naming what you\\'re thankful for.'],\n  ['Growth','Expanding capability, reach, or scale.'],\n  ['Harmony','Seeking agreement over conflict.'],\n  ['Health','Protecting physical and mental well-being.'],\n  ['Home','Valuing a sense of place and stability.'],\n  ['Honesty','Telling the truth, even when hard.'],\n  ['Hope','Believing things can and will improve.'],\n  ['Humility','Staying grounded despite success.'],\n  ['Humor','Not taking everything too seriously.'],\n  ['Inclusion','Making sure every voice has a seat.'],\n  ['Independence','Standing on your own judgment and resources.'],\n  ['Initiative','Acting before being told to.'],\n  ['Integrity','Doing right even when no one is watching.'],\n  ['Intuition','Trusting instinct alongside evidence.'],\n  ['Job security','Offering people confidence in their footing.'],\n  ['Joy','Choosing delight, not just duty.'],\n  ['Justice','Making sure outcomes are fair and earned.'],\n  ['Kindness','Choosing warmth in small everyday moments.'],\n  ['Knowledge','Valuing depth of understanding.'],\n  ['Leadership','Setting a direction others can follow.'],\n  ['Learning','Staying curious and improving.'],\n  ['Legacy','Building something that outlasts you.'],\n  ['Leisure','Protecting time to rest and recharge.'],\n  ['Love','Leading with genuine care.'],\n  ['Loyalty','Standing by people and commitments.'],\n  ['Making a difference','Wanting the work to actually matter.'],\n  ['Nature','Respecting and pr
