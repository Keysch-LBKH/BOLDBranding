ay:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;\">\n            <sc-for list=\"{{ guideColors }}\" as=\"c\" hint-placeholder-count=\"5\">\n              <div style=\"width:64px;\">\n                <div style=\"width:64px;height:64px;background:{{ c.hex }};border:2px solid var(--color-text);\"><\u002Fdiv>\n                <div style=\"font:600 10px var(--font-body);color:var(--color-text);margin-top:4px;\">{{ c.name }}<\u002Fdiv>\n                <div style=\"font:400 10px var(--font-body);color:var(--color-neutral-600);\">{{ c.hex }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font:400 13px/1.6 var(--font-body);color:var(--color-text);\"><b>{{ guide.visual.headingFont }}<\u002Fb> + {{ guide.visual.bodyFont }}<\u002Fdiv>\n          <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-700);margin-bottom:10px;\">{{ guide.visual.fontRationale }}<\u002Fdiv>\n          <div style=\"font:600 11px var(--font-body);color:var(--color-neutral-600);margin-bottom:4px;\">Logo concept<\u002Fdiv>\n          <div style=\"font:400 13px/1.5 var(--font-body);color:var(--color-text);\">{{ guide.visual.logoConcept }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"sec-dodont\" style=\"border-top:2px solid var(--color-neutral-300);padding-top:14px;\">\n          <div style=\"font:600 11px var(--font-body);letter-spacing:0.06em;text-transform:uppercase;color:var(--color-accent-700);margin-bottom:8px;\">Do's &amp; Don'ts<\u002Fdiv>\n          <sc-for list=\"{{ guideDoDont }}\" as=\"item\" hint-placeholder-count=\"3\">\n            <div style=\"padding:8px 0;border-bottom:2px solid var(--color-neutral-300);\">\n              <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-accent-700);\">✓ {{ item.do }}<\u002Fdiv>\n              <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-500);\">✗ {{ item.dont }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"border-top:2px solid var(--color-neutral-300);padding-top:16px;display:flex;flex-direction:column;gap:10px;\">\n          <div style=\"font:600 12px var(--font-body);color:var(--color-text);\">Save this guide<\u002Fdiv>\n          <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-600);\">Take a screenshot to keep it, or enter your email and we'll send you a copy.<\u002Fdiv>\n          <sc-if value=\"{{ emailSent }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font:600 13px var(--font-body);color:var(--color-accent-700);\">Sent to {{ emailValue }}.<\u002Fdiv>\n          <\u002Fsc-if>\n          <div style=\"display:flex;gap:8px;\">\n            <input class=\"input\" type=\"email\" placeholder=\"you@business.com\" value=\"{{ emailValue }}\" sc-camel-on-change=\"{{ onEmailChange }}\" style=\"flex:1;\">\n            <button sc-camel-on-click=\"{{ onSendEmail }}\" class=\"btn btn-secondary\" disabled=\"{{ emailSendDisabled }}\">Email Me<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onPrint }}\" class=\"btn btn-primary btn-block\">Print / Export<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ onExportJson }}\" class=\"btn btn-secondary btn-block\">Download JSON (for agent/staff training)<\u002Fbutton>\n        <div class=\"field\" style=\"margin-top:4px;\">\n          <label>GoHighLevel webhook URL<\u002Flabel>\n          <input class=\"input\" type=\"text\" placeholder=\"https://services.leadconnectorhq.com/hooks/...\" value=\"{{ ghlWebhookUrl }}\" sc-camel-on-change=\"{{ onGhlWebhookUrlChange }}\">\n        <\u002Fdiv>\n        <div style=\"font:400 12px/1.5 var(--font-body);color:var(--color-neutral-700);\">Creates/updates this contact in GHL and hands the full brand guide to a workflow so it can send the guide to the client automatically.<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ onSendToGhl }}\" class=\"btn btn-secondary btn-block\" disabled=\"{{ sendingToGhl }}\">{{ ghlSendLabel }}<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ resetAll }}\" class=\"btn btn-ghost btn-block\">Start Over<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ showFooter }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:14px 20px 20px;border-top:2px solid var(--color-neutral-300);display:flex;gap:10px;\">\n      <sc-if value=\"{{ showBackBtn }}\" hint-placeholder-val=\"{{ false }}\">\n        <button sc-camel-on-click=\"{{ onBack }}\" class=\"btn btn-secondary\">Back<\u002Fbutton>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ onNext }}\" class=\"btn btn-primary btn-block\" disabled=\"{{ nextDisabled }}\">{{ nextLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ showSavedNote }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:10px 20px 0;display:flex;align-items:center;justify-content:center;gap:7px;\">\n      <div style=\"width:6px;height:6px;background:var(--color-accent);flex:none;\"><\u002Fdiv>\n      <div style=\"font:500 11px/1.4 var(--font-body);color:var(--color-neutral-600);\">Progress saved — you can close this and come back.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <div style=\"padding:14px 20px;border-top:2px solid var(--color-neutral-300);display:flex;align-items:center;justify-content:center;gap:6px;\">\n    <a href=\"https://lbkh.solutions\" target=\"_blank\" rel=\"noopener\" style=\"font:600 11px var(--font-body);color:var(--color-neutral-700);text-decoration:none;\">LBKH Solutions. Already working for you.<\u002Fa>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst CURATED = [\n  ['Accountability','Owning outcomes, good or bad.'],\n  ['Achievement','Setting and hitting real goals.'],\n  ['Adaptability','Adjusting quickly as conditions change.'],\n  ['Adventure','Seeking out new challenges and experiences.'],\n  ['Altruism','Putting others\\' good ahead of self-interest.'],\n  ['Ambition','Pushing for bigger goals.'],\n  ['Authenticity','Being genuinely yourself, not a performance.'],\n  ['Balance','Keeping work and life in proportion.'],\n  ['Beauty','Caring about craft, form and aesthetics.'],\n  ['Being the best','Aiming to lead the field.'],\n  ['Belonging','Making sure people feel they fit in.'],\n  ['Career','Investing in long-term professional growth.'],\n  ['Caring','Genuinely looking out for others.'],\n  ['Collaboration','Working together across teams.'],\n  ['Commitment','Following through on what you start.'],\n  ['Community','Investing in the people around the business.'],\n  ['Compassion','Responding to others\\' struggles with empathy.'],\n  ['Competence','Being genuinely skilled at the work.'],\n  ['Confidence','Acting with conviction in your ability.'],\n  ['Connection','Building real relationships, not just transactions.'],\n  ['Contentment','Finding satisfaction in what you have.'],\n  ['Contribution','Adding something of real value.'],\n  ['Cooperation','Choosing to work with, not against.'],\n  ['Courage','Doing the hard right thing.'],\n  ['Creativity','Generating original ideas and solutions.'],\n  ['Curiosity','Staying genuinely interested in how and why.'],\n  ['Dignity','Treating everyone as worthy of respect.'],\n  ['Diversity','Valuing different backgrounds and perspectives.'],\n  ['Environment','Protecting the natural world you operate in.'],\n  ['Efficiency','Getting more from less.'],\n  ['Equality','Giving everyone the same standing and chance.'],\n  ['Ethics','Doing what\\'s right, not just what\\'s legal.'],\n  ['Excellence','Refusing to settle for good enough.'],\n  ['Fairness','Treating people equitably.'],\n  ['Faith','Trusting in something larger than yourself.'],\n  ['Family','Honoring the people closest to you.'],\n  ['Financial stability','Building a business that can weather hard times.'],\n  ['Forgiveness','Letting go of grudges and mistakes.'],\n  ['Freedom','Preserving room to choose and act.'],\n  ['Friendship','Valuing warm, loyal relationships.'],\n  ['Fun','Making the work genuinely enjoyable.'],\n  ['Future generations','Building with tomorrow in mind, not just today.'],\n  ['Generosity','Giving freely of time, money or effort.'],\n  ['Giving back','Returning value to the community you draw from.'],\n  ['Grace','Extending patience and goodwill, especially when hard.'],\n  ['Gratitude','Noticing and naming what you\\'re thankful for.'],\n  ['Growth','Expanding capability, reach, or scale.'],\n  ['Harmony','Seeking agreement over conflict.'],\n  ['Health','Protecting physical and mental well-being.'],\n  ['Home','Valuing a sense of place and stability.'],\n  ['Honesty','Telling the truth, even when hard.'],\n  ['Hope','Believing things can and will improve.'],\n  ['Humility','Staying grounded despite success.'],\n  ['Humor','Not taking everything too seriously.'],\n  ['Inclusion','Making sure every voice has a seat.'],\n  ['Independence','Standing on your own judgment and resources.'],\n  ['Initiative','Acting before being told to.'],\n  ['Integrity','Doing right even when no one is watching.'],\n  ['Intuition','Trusting instinct alongside evidence.'],\n  ['Job security','Offering people confidence in their footing.'],\n  ['Joy','Choosing delight, not just duty.'],\n  ['Justice','Making sure outcomes are fair and earned.'],\n  ['Kindness','Choosing warmth in small everyday moments.'],\n  ['Knowledge','Valuing depth of understanding.'],\n  ['Leadership','Setting a direction others can follow.'],\n  ['Learning','Staying curious and improving.'],\n  ['Legacy','Building something that outlasts you.'],\n  ['Leisure','Protecting time to rest and recharge.'],\n  ['Love','Leading with genuine care.'],\n  ['Loyalty','Standing by people and commitments.'],\n  ['Making a difference','Wanting the work to actually matter.'],\n  ['Nature','Respecting and protecting the natural world.'],\n  ['Openness','Being receptive to new ideas and feedback.'],\n  ['Optimism','Expecting good outcomes, even under pressure.'],\n  ['Order','Valuing structure and predictability.'],\n  ['Parenting','Prioritizing the raising of the next generation.'],\n  ['Patience','Staying steady while things take time.'],\n  ['Patriotism','Pride and duty toward one\\'s country.'],\n  ['Peace','Preferring calm resolution over conflict.'],\n  ['Perseverance','Pushing through when things get hard.'],\n  ['Personal fulfillment','Wanting work that feels meaningful.'],\n  ['Power','Valuing influence and the ability to shape outcomes.'],\n  ['Pride','Taking real ownership in the work\\'s quality.'],\n  ['Recognition','Wanting effort and results to be seen.'],\n  ['Reliability','Being consistent and dependable.'],\n  ['Resourcefulness','Making progress with limited means.'],\n  ['Respect','Valuing people\\'s dignity and input.'],\n  ['Responsibility','Owning your role and its consequences.'],\n  ['Risk-taking','Being willing to bet on the unproven.'],\n  ['Safety','Protecting people from harm.'],\n  ['Security','Building stability people can count on.'],\n  ['Self-discipline','Doing what\\'s needed, not just what\\'s easy.'],\n  ['Self-expression','Making room for individuality to show.'],\n  ['Self-respect','Holding your own standards, regardless of others.'],\n  ['Serenity','Valuing calm over chaos.'],\n  ['Service','Putting others\\' needs at the center of the work.'],\n  ['Simplicity','Cutting complexity wherever you can.'],\n  ['Spirituality','Connecting the work to something deeper.'],\n  ['Sportsmanship','Competing fairly and with respect.'],\n  ['Stewardship','Managing resources responsibly for those who come after.'],\n  ['Success','Measuring and pursuing real results.'],\n  ['Teamwork','Winning and losing together.'],\n  ['Thrift','Being careful and deliberate with resources.'],\n  ['Time','Treating time as the scarcest resource.'],\n  ['Tradition','Honoring what\\'s been proven over time.'],\n  ['Travel','Valuing exposure to new places and ideas.'],\n  ['Trust','Being someone others can rely on.'],\n  ['Truth','Insisting on accuracy over convenience.'],\n  ['Understanding','Seeking to truly grasp others\\' perspective.'],\n  ['Uniqueness','Standing apart rather than blending in.'],\n  ['Usefulness','Making sure the work solves real problems.'],\n  ['Vision','Working toward a clear future.'],\n  ['Vulnerability','Being willing to be seen, uncertainty included.'],\n  ['Wealth','Building real financial resources.'],\n  ['Well-being','Caring for the people who do the work.'],\n  ['Wholeheartedness','Showing up fully, not half-in.'],\n  ['Wisdom','Applying judgment earned through experience.'],\n].map((p,i)=>({id:'v'+i, label:p[0], def:p[1]}));\n\nconst LIFE_AREAS = ['Founding this business','Building the team','Serving customers','Day-to-day operations','Growth & strategy decisions'];\nconst COL_DEFS = [\n  {key:'love', title:'Love', color:'var(--color-accent-700)'},\n  {key:'like', title:'Like', color:'var(--color-neutral-800)'},\n  {key:'tolerate', title:'Tolerate', color:'var(--color-neutral-600)'},\n  {key:'dislike', title:'Dislike', color:'var(--color-neutral-500)'}\n];\nconst STORE_KEY = 'bizValuesApp_v1';\n\nfunction defaultState(){\n  return {\n    screen: 'intro',\n    contact: {yourName:'', phone:'', email:'', businessName:'', website:'', social:''},\n    lifeSubIdx: 0,\n    lifeData: LIFE_AREAS.map(()=>({love:[],like:[],tolerate:[],dislike:[]})),\n    colDrafts: {love:'',like:'',tolerate:'',dislike:''},\n    themesNote: '', dislikeNote: '',\n    selectedIds: [], customItems: [], customDraft: '',\n    narrowIntroSeen: false,\n    round: 1, swipeQueue: [], swipeIndex: 0, kept: [], discarded: [],\n    swipeDragX: 0, swipeDragging: false, swipeAnimating: false,\n    rankList: [], topCount: 7, dragIndex: null,\n    reflLearned:'', reflSurprises:'', reflStop:'', reflLess:'', reflMore:'', reflContinue:'', reflStart:'',\n    reflEssential:'', reflAvoid:'', reflThreeYear:'', reflAction:'', reflByWhen:'',\n    businessName:'', statementNotes: {}, missionStatement:'', generatingStatement:false, generateError:'',\n    emailValue:'', emailSent:false,\n    pcPersonas: [{name:'', answers:{}, otherValues:{}, otherActive:{}}],\n    interviewIdx: 0, interviewMessages: [], interviewAnswers: {}, interviewDraft: '', micListening: false, showTypeInput: false,\n    guide: null, generatingGuide: false, guideError: '',\n    visualOptions: null, generatingVisual: false, visualError: '', chosenPaletteIdx: 0, chosenFontIdx: 0, regeneratingLogo: false,\n    biz: {tagline:'', whatYouDo:'', hoursText:'', daysOff:'', areasServed:'', location:'', reachType:'', reachOther:'',\n      phone:'', email:'', website:'', bookingLink:'', paymentMethods:'', pricingModel:'', priceRange:'',\n      cancellationPolicy:'', guarantee:'', teamSize:'', otherPolicies:''},\n    faqs: [{q:'', a:''}],\n    ghlWebhookUrl: 'https://services.leadconnectorhq.com/hooks/fkyVaCUPjbDUBzUopuLP/webhook-trigger/fcbe76f7-8a93-4635-acc0-eec6549dff6a',\n    theme: 'light'\n  };\n}\n\nconst PC_QUESTIONS = [\n  {id:'age', text:\"What's their age range?\", options:['Under 25','25–35','35–45','45–55','55–65','65+']},\n  {id:'gender', text:\"What's their gender?\", options:['Woman','Man','Non-binary']},\n  {id:'role', text:'What is their job type?', options:['Solo entrepreneur or founder','Manager or team lead','Executive or senior decision-maker']},\n  {id:'pain', text:\"What's their biggest pain point when they find you?\", options:[\"They're overwhelmed and need it handled\",\"They know what they want but lack the time or skill\",\"They've been burned by someone before\"]},\n  {id:'value', text:'What do they value most when choosing who to work with?', options:['Speed and responsiveness','Deep expertise and quality','Trust and relationship']},\n  {id:'decide', text:'How do they make decisions?', options:['Fast, gut-driven','Careful, researches everything first','Needs buy-in from others']},\n  {id:'why', text:'Why would they choose you over a competitor?', options:['Better results','Better experience or relationship','Better value or price']}\n];\n\nconst INTERVIEW_QUESTIONS = [\n  {id:'persona', prompt:\"If your brand were a person walking into a room, how would they act — confident and bold, or warm and easygoing?\"},\n  {id:'formality', prompt:'How formal is your writing usually — buttoned-up, conversational, or somewhere in between?'},\n  {id:'banned', prompt:\"Any jargon, buzzwords, or phrases you never want to see in your business's writing?\"},\n  {id:'threewords', prompt:\"What are 2-3 words you'd love customers to use to describe you?\"},\n  {id:'coremessage', prompt:'What\\'s the single most important message you want every customer to walk away understanding?'},\n  {id:'pillar', prompt:\"Besides your values, what's a theme your marketing or conversations keep coming back to?\"},\n  {id:'competitor', prompt:\"Who's your biggest competitor or alternative, and what do you do differently?\"},\n  {id:'origin', prompt:'What\\'s the origin story — why did you start this business?'},\n  {id:'moment', prompt:\"What's a moment or story that captures what this business is really about?\"},\n  {id:'colors', prompt:'Do you already have brand colors, or a color feeling in mind? Describe it, even loosely — or say \"not yet\" and we\\'ll suggest some.'},\n  {id:'fonts', prompt:'Do you have a logo or font style already, or should we suggest a direction?'},\n  {id:'dodont', prompt:\"Give an example of something you'd say to a client — and something you'd never say.\"},\n  {id:'neverdo', prompt:'What\\'s one thing this brand should never do, visually or verbally?'},\n  {id:'anything', prompt:'Anything else you want baked into your brand guide?'}\n];\n\nclass Component extends DCLogic {\n  state = defaultState();\n\n  applyTheme(){\n    document.documentElement.setAttribute('data-theme', this.state.theme === 'dark' ? 'dark' : 'light');\n  }\n  componentDidUpdate(_, prevState){\n    if(prevState.theme !== this.state.theme) this.applyTheme();\n  }\n  onToggleTheme = () => {\n    this.setState(s => ({theme: s.theme === 'dark' ? 'light' : 'dark'}), () => this.applyTheme());\n  };\n  componentDidMount(){\n    this.applyTheme();\n    try{\n      const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');\n      if(saved){ saved.sendingToGhl = false; }\n      if(saved) this.setState(saved, () => {\n        if(this.state.screen==='statement' && !this.state.missionStatement && !this.state.generatingStatement) this.generateStatement();\n      });\n    }catch(e){}\n    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;\n    if(SR){\n      this.recognition = new SR();\n      this.recognition.continuous = false;\n      this.recognition.interimResults = false;\n      this.recognition.onresult = (e) => {\n        const t = e.results[0][0].transcript;\n        this.setState({interviewDraft: (this.state.interviewDraft ? this.state.interviewDraft+' ' : '') + t, micListening:false});\n      };\n      this.recognition.onend = () => { this.setState({micListening:false}); };\n      this.recognition.onerror = () => { this.setState({micListening:false}); };\n    }\n  }\n  componentDidUpdate(prevState){\n    const {dragIndex, swipeDragging, sendingToGhl, ...persist} = this.state;\n    localStorage.setItem(STORE_KEY, JSON.stringify(persist));\n    if(this.state.visualOptions && this.state.visualOptions !== prevState.visualOptions){\n      this.loadFontPreviews(this.state.visualOptions.fontPairings);\n    }\n  }\n\n  resetAll = () => { this.setState(defaultState()); };\n\n  // ---- life review ----\n  addLifeItem = (col) => {\n    const draft = this.state.colDrafts[col].trim();\n    if(!draft) return;\n    const lifeData = this.state.lifeData.slice();\n    const area = {...lifeData[this.state.lifeSubIdx]};\n    area[col] = area[col].concat(draft);\n    lifeData[this.state.lifeSubIdx] = area;\n    this.setState({lifeData, colDrafts: {...this.state.colDrafts, [col]: ''}});\n  };\n  removeLifeItem = (col, idx) => {\n    const lifeData = this.state.lifeData.slice();\n    const area = {...lifeData[this.state.lifeSubIdx]};\n    area[col] = area[col].filter((_,i)=>i!==idx);\n    lifeData[this.state.lifeSubIdx] = area;\n    this.setState({lifeData});\n  };\n\n  // ---- brainstorm ----\n  toggleCurated = (id) => {\n    const has = this.state.selectedIds.includes(id);\n    this.setState({selectedIds: has ? this.state.selectedIds.filter(x=>x!==id) : this.state.selectedIds.concat(id)});\n  };\n  addCustom = () => {\n    const label = this.state.customDraft.trim();\n    if(!label) return;\n    const id = 'c'+Date.now();\n    this.setState({customItems: this.state.customItems.concat({id,label}), customDraft:''});\n  };\n  removeCustom = (id) => { this.setState({customItems: this.state.customItems.filter(c=>c.id!==id)}); };\n\n  getSelectedLabels = () => {\n    const curated = CURATED.filter(v=>this.state.selectedIds.includes(v.id)).map(v=>v.label);\n    const custom = this.state.customItems.map(c=>c.label);\n    return curated.concat(custom);\n  };\n\n  // ---- narrow (swipe) ----\n  shuffle = (arr) => {\n    const a = arr.slice();\n    for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }\n    return a;\n  };\n  onStartNarrowRound = () => {\n    this.setState({narrowIntroSeen:true, round:1, swipeQueue: this.shuffle(this.getSelectedLabels()), swipeIndex:0, kept:[], discarded:[], swipeDragX:0});\n  };\n  commitSwipeDecision = (isKeep) => {\n    const st = this.state;\n    if(st.swipeIndex >= st.swipeQueue.length) return;\n    const label = st.swipeQueue[st.swipeIndex];\n    const kept = isKeep ? st.kept.concat(label) : st.kept;\n    const newIndex = st.swipeIndex+1;\n    if(newIndex >= st.swipeQueue.length && kept.length >= 8){\n      this.setState({swipeQueue: this.shuffle(kept), swipeIndex:0, kept:[], discarded:[], round: st.round+1, swipeDragX:0, swipeDragging:false});\n    } else {\n      this.setState({kept, swipeIndex:newIndex, swipeDragX:0, swipeDragging:false});\n    }\n  };\n  onKeep = () => this.commitSwipeDecision(true);\n  onDiscard = () => this.commitSwipeDecision(false);\n  onCardPointerDown = (e) => { this.setState({swipeDragging:true, dragStartX: e.clientX}); };\n  onCardPointerMove = (e) => {\n    if(!this.state.swipeDragging) return;\n    this.setState({swipeDragX: e.clientX - this.state.dragStartX});\n  };\n  onCardPointerUp = () => {\n    const x = this.state.swipeDragX;\n    if(!this.state.swipeDragging){ return; }\n    if(x > 100){ this.commitSwipeDecision(true); return; }\n    if(x < -100){ this.commitSwipeDecision(false); return; }\n    this.setState({swipeDragX:0, swipeDragging:false});\n  };\n\n  // ---- rank ----\n  enterRank = () => {\n    const list = this.state.kept.length ? this.state.kept : this.getSelectedLabels();\n    this.setState({rankList: list, topCount: Math.max(3,Math.min(10,list.length))});\n  };\n  moveItem = (idx, dir) => {\n    const to = idx + dir;\n    const list = this.state.rankList.slice();\n    if(to<0 || to>=list.length) return;\n    [list[idx], list[to]] = [list[to], list[idx]];\n    this.setState({rankList: list});\n  };\n  setTopCount = (e) => { this.setState({topCount: parseInt(e.target.value,10)}); };\n\n  // ---- statement ----\n  setNote = (label, e) => {\n    this.setState({statementNotes: {...this.state.statementNotes, [label]: e.target.value}});\n  };\n  doPrint = () => { window.print(); };\n  onEmailChange = (e) => { this.setState({emailValue: e.target.value, emailSent:false}); };\n  onSendEmail = () => {\n    if(!this.state.emailValue.includes('@')) return;\n    this.setState({emailSent:true});\n  };\n  onGoToPerfectClient = () => { this.setState({screen:'perfectclient'}); };\n  pcSetName = (idx, e) => {\n    const personas = (this.state.pcPersonas||[{name:'',answers:{},otherValues:{},otherActive: n      this.generateVisualOptions(answers);\n    }\n  };\n  generateVisualOptions = async (answers) => {\n    this.setState({generatingVisual:true, visualError:''});\n    const st = this.state;\n    const colorsAnswer = answers.colors || '';\n    const fontsAnswer = answers.fonts || '';\n    try{\n      const prompt = `You are a brand designer suggesting visual identity directions for a small business.\nBusiness name: \"${st.businessName || 'This business'}\"\nCore values: ${st.rankList.slice(0, st.topCount).join(', ')}\nBrand personality: ${answers.persona || ''}\nWhat they said about colors: \"${colorsAnswer}\"\nWhat they said about fonts/logo: \"${fontsAnswer}\"\n\nProduce ONLY valid JSON (no markdown) in this exact shape:\n{\n  \"palettes\": [\n    [{\"hex\":\"#RRGGBB\",\"name\":\"...\",\"role\":\"Primary\"}, {\"hex\":\"#RRGGBB\",\"name\":\"...\",\"role\":\"Accent\"}, {\"hex\":\"#RRGGBB\",\"name\":\"...\",\"role\":\"Neutral\"}, {\"hex\":\"#RRGGBB\",\"name\":\"...\",\"role\":\"Neutral Dark\"}],\n    [... a second distinct cohesive palette, same shape ...],\n    [... a third distinct cohesive palette, same shape ...]\n  ],\n  \"fontPairings\": [\n    {\"heading\":\"real Google Font name\",\"body\":\"real Google Font name\",\"rationale\":\"1 sentence why\"},\n    {\"heading\":\"...\",\"body\":\"...\",\"rationale\":\"...\"},\n    {\"heading\":\"...\",\"body\":\"...\",\"rationale\":\"...\"}\n  ],\n  \"logoConcept\": \"2-3 sentence description of a logo mark/wordmark direction — a concept, not a design\"\n}\nIf they already described real colors or fonts, make one of the three options closely reflect that description, and offer two alternate directions.`;\n      const text = await this.aiComplete({messages:[{role:'user', content: prompt}], max_tokens: 2000});\n      const jsonMatch = text.match(/\\{[\\s\\S]*\\}/);\n      const parsed = JSON.parse(jsonMatch ? jsonMatch[0] : text);\n      this.setState({visualOptions: parsed, generatingVisual:false, chosenPaletteIdx:0, chosenFontIdx:0, screen:'visual'});\n    }catch(e){\n      this.setState({generatingVisual:false, visualError: \"Couldn't generate visual suggestions. Check your connection and try again.\"});\n    }\n  };\n  onRetryVisual = () => { this.generateVisualOptions(this.state.interviewAnswers); };\n  loadFontPreviews = (pairings) => {\n    try{\n      const families = new Set();\n      (pairings||[]).forEach(p => { if(p.heading) families.add(p.heading); if(p.body) families.add(p.body); });\n      families.forEach(name => {\n        const id = 'gf-'+name.replace(/[^a-z0-9]/gi,'-');\n        if(document.getElementById(id)) return;\n        const link = document.createElement('link');\n        link.id = id; link.rel = 'stylesheet';\n        link.href = 'https://fonts.googleapis.com/css2?family=' + name.replace(/ /g,'+') + ':wght@400;700&display=swap';\n        document.head.appendChild(link);\n      });\n    }catch(e){ console.error('loadFontPreviews failed', e); }\n  };\n  onChoosePalette = (idx) => { this.setState({chosenPaletteIdx: idx}); };\n  onChooseFont = (idx) => { this.setState({chosenFontIdx: idx}); };\n  onRegenerateLogo = async () => {\n    const st = this.state;\n    this.setState({regeneratingLogo:true});\n    try{\n      const prompt = `Suggest a different logo concept direction (2-3 sentences, a concept not a design) for a business named \"${st.businessName||'this business'}\" with values ${st.rankList.slice(0,st.topCount).join(', ')} and brand personality: ${st.interviewAnswers.persona||''}. Return only the description text, no JSON, no quotes.`;\n      const text = await this.aiComplete(prompt);\n      this.setState({visualOptions: {...st.visualOptions, logoConcept: text.trim()}, regeneratingLogo:false});\n    }catch(e){ this.setState({regeneratingLogo:false}); }\n  };\n  onContinueFromVisual = () => {\n    const st = this.state;\n    const palette = st.visualOptions.palettes[st.chosenPaletteIdx];\n    const font = st.visualOptions.fontPairings[st.chosenFontIdx];\n    this.generateGuide(st.interviewAnswers, {colors: palette, headingFont: font.heading, bodyFont: font.body, fontRationale: font.rationale, logoConcept: st.visualOptions.logoConcept});\n  };\n  generateGuide = async (answers, chosenVisual) => {\n    const st = this.state;\n    this.setState({generatingGuide:true, guideError:''});\n    const topLabels = st.rankList.slice(0, st.topCount);\n    const personas = (st.pcPersonas||[]).filter(p=>p.name && p.name.trim());\n    const personaSummary = personas.map(p => `${p.name}: ${PC_QUESTIONS.map(q=>`${q.text} ${p.answers[q.id]||''}`).join(' | ')}`).join('\\n');\n    const interviewSummary = INTERVIEW_QUESTIONS.map(q => `${q.prompt} => ${answers[q.id]||''}`).join('\\n');\n    try{\n      const prompt = `You are a brand strategist producing a full brand guide for a small business, usable both as a printable brand guide and as training material for staff/AI agents.\nBusiness name: \"${st.businessName || 'This business'}\"\nCore values (ranked): ${topLabels.join(', ')}\nMission statement: \"${st.missionStatement}\"\nPerfect client persona(s):\n${personaSummary || 'Not defined'}\nBrand voice interview answers:\n${interviewSummary}\n\nProduce a JSON object (no markdown, no commentary) with exactly this shape:\n{\n  \"toneSummary\": \"2-3 sentence description of the brand's voice and personality\",\n  \"vocabularyUse\": [\"word or phrase to use\", ...4-8 items],\n  \"vocabularyAvoid\": [\"word, phrase or jargon to avoid\", ...3-6 items],\n  \"messagingPillars\": [{\"title\":\"short pillar name\",\"desc\":\"1-2 sentence explanation\"}, ...3-4 items],\n  \"differentiation\": \"2-3 sentences on how this business is different from alternatives\",\n  \"originStory\": \"3-4 sentence origin story in brand voice, grounded in their answers\",\n  \"doDont\": [{\"do\":\"an example phrase or behavior to do\",\"dont\":\"the corresponding thing to avoid\"}, ...3-4 items grounded in their answers]\n}`;\n      const text = await this.ai
